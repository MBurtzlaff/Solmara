function foeIntel(f){ if(!G.known[f.id]) return '<br><span class="dim">Weakness unknown — use Analyze, or try elements</span>';
  if(f.shiftEl) return `<br><span class="good">Weak now: ${ELEMS[f.shiftEl]}</span>`;
  const w=Object.keys(f.el).filter(k=>f.el[k]>1).map(k=>ELEMS[k]), r=Object.keys(f.el).filter(k=>f.el[k]<1).map(k=>ELEMS[k]+(f.el[k]===0?' (immune)':''));
  return `<br><span class="good">${w.length?'Weak: '+w.join(' '):'No weakness'}</span>${r.length?` <span class="bad">Resists: ${r.join(' ')}</span>`:''}`; }
function bCanvasTap_v01(e){ if(!B||!B.targeting) return; const cv=$('bcv'); const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*BW, y=(e.clientY-r.top)/r.height*BH;
  let best=null,bd=1e9; for(const f of liveFoes()){ const d=Math.abs(f.x-x)+Math.abs((f.y-f.sz/2)-y)*0.5; if(d<bd){ bd=d; best=f; } } if(best&&bd<60){ const dn=B.targeting.done; B.targeting=null; dn(best); } }
function tryRun(){ const ps=liveParty().reduce((a,c)=>a+uSpd(c),0)/Math.max(1,liveParty().length), es=liveFoes().reduce((a,f)=>a+uSpd(f),0)/Math.max(1,liveFoes().length);
  const p=clamp(0.55+(ps-es)*0.04,0.25,0.95); if(chance(p)){ sfx('run'); bLog('🏃 You got away!'); const r=B.cmdResolve; B.cmdResolve=null; r('fled'); }
  else { sfx('bump'); bLog('🏃 Couldn\'t escape!'); B.cmds=choosers().map(c=>({actor:c,type:'skip'})); const r=B.cmdResolve; B.cmdResolve=null; bShowCmd(null); r(B.cmds.slice()); } }

// ---------- executing ----------
async function executeRound(cmds){ for(const c of liveParty()) if(!cmds.some(x=>x.actor===c)) cmds.push({actor:c,type:'skip'});
  const acts=cmds.map(c=>({...c,spd:uSpd(c.actor)*rnd(0.85,1.15)+(c.type==='defend'?1000:0)}));
  for(const f of liveFoes()) acts.push({actor:f,type:'enemy',spd:uSpd(f)*rnd(0.85,1.15)});
  acts.sort((a,b)=>b.spd-a.spd); bTurnOrder(acts);
  for(const a of acts){ if(!B||B.over) return; const u=a.actor; if(!uAlive(u)) continue; const st=uSt(u);
    if(st.sleep){ bLog(`💤 ${u.name} is asleep.`); await wait(380); continue; } if(st.stun){ bLog(`💫 ${u.name} can't move!`); st.stun--; if(st.stun<=0) delete st.stun; await wait(380); continue; }
    if(a.type==='skip') continue; if(a.type==='defend'){ st.defend=1; bLog(`🛡 ${u.name} defends.`); continue; }
    if(a.type==='enemy') await enemyAct(u); else await partyAct(a);
    bRenderParty(); if(!liveFoes().length||!liveParty().length) return; await wait(260); } }
function bTurnOrder(acts){ const el=$('b-order'); if(!el) return; el.innerHTML='Turn order: '+acts.filter(a=>uAlive(a.actor)).map(a=>`<span class="${isFoe(a.actor)?'bad':'good'}">${escapeHtml(a.actor.name.split(' ')[0])}</span>`).join(' › '); }
function retarget(a,u){ let t=a.target; const ab=a.ab&&AB[a.ab]; const tt=a.type==='attack'?'enemy':ab?ab.t:null;
  if(a.type==='item'){ const it=ITEMS[a.item]; if(it.revive){ if(t&&!uAlive(t)) return t; return null; } if(it.dmg) return null; if(t&&uAlive(t)) return t; return liveParty()[0]; }
  if(tt==='enemy'){ if(!t||!uAlive(t)) t=pick(liveFoes()); return t; } if(tt==='ally'){ if(!t||!uAlive(t)) t=liveParty().sort((p,q)=>p.hp/maxHP(p)-q.hp/maxHP(q))[0]; return t; } if(tt==='ko'){ return t&&!uAlive(t)?t:null; } return t; }
async function partyAct(a){ const u=a.actor; const t=retarget(a,u);
  if(a.type==='attack'){ bLog(`⚔ ${u.name} attacks.`); await physHit(u,t,{p:1,el:weaponEl(u),ranged:cRanged(u)}); const w=u.eq.weapon&&ITEMS[u.eq.weapon]; if(w&&uAlive(t)){ if(w.stun&&chance(w.stun)) applyStatus(t,'stun',1,1); if(w.poison&&chance(w.poison)) applyStatus(t,'poison',1,4); } return; }
  if(a.type==='item'){ const it=ITEMS[a.item]; if(!invHas(a.item)){ bLog(`${u.name} reaches for a ${it.n}, but there are none left.`); return; } invAdd(a.item,-1); bLog(`🧪 ${u.name} uses ${it.n}.`); await useItemOn(it,t); return; }
  if(a.type==='ability'){ const ab=AB[a.ab]; if(ab.k==='spell'&&uSt(u).silence){ bLog(`🤐 ${u.name} is silenced!`); return; }
    if(ab.hpCost){ const c2=Math.ceil(maxHP(u)*ab.hpCost); if(u.hp<=c2){ bLog(`${u.name} is too hurt for ${ab.name}.`); return; } u.hp-=c2; } else { if(u.mp<ab.mp){ bLog(`${u.name} lacks the MP for ${ab.name}.`); return; } u.mp-=ab.mp; }
    bLog(`${ab.k==='spell'?'✧':'✦'} ${u.name}: <b>${ab.name}</b>`); sfx(ab.k==='spell'?'magic':'skill'); await doAbility(u,ab,t); } }
function weaponEl(u){ const w=u.eq.weapon&&ITEMS[u.eq.weapon]; return w&&w.el; }
async function doAbility(u,ab,t){ const targets=ab.t==='enemies'?liveFoes():ab.t==='allies'?liveParty():ab.t==='self'?[u]:ab.t==='rand'?null:[t].filter(Boolean);
  if(ab.t==='rand'){ for(let i=0;i<(ab.hits||1);i++){ const f=pick(liveFoes()); if(!f) break; await physHit(u,f,{p:ab.p,el:ab.el||weaponEl(u),ranged:ab.ranged||cRanged(u)}); await wait(120); } return; }
  if(!targets.length){ bLog('…but there is no target.'); return; }
  for(const tg of targets){
    switch(ab.e){
     case 'phys': for(let i=0;i<(ab.hits||1);i++){ if(!uAlive(tg)) break; await physHit(u,tg,{p:ab.p,el:ab.el||weaponEl(u),ranged:ab.ranged||cRanged(u),sure:ab.sure,crit:ab.crit,critAdd:ab.critAdd,pierce:ab.pierce}); if((ab.hits||1)>1) await wait(110); }
       if(uAlive(tg)&&ab.st) tryStatus(tg,ab.st); if(ab.steal&&uAlive(tg)) doSteal(u,tg); if(ab.kill&&uAlive(tg)&&!tg.boss&&chance(ab.kill)){ tg.hp=0; bLog(`☠ ${tg.name} is struck down!`); onKO(tg); } break;
     case 'mag': await magHit(u,tg,ab.p,ab.el); if(uAlive(tg)&&ab.st) tryStatus(tg,ab.st); break;
     case 'drain': { const d=await magHit(u,tg,ab.p,ab.el); if(d>0){ if(ab.mpDrain){ const m=Math.max(1,Math.round(d/5)); u.mp=Math.min(maxMP(u),u.mp+m); fxNum(u,'+'+m+' MP','#8cf'); } else { const h=Math.round(d*0.5); u.hp=Math.min(maxHP(u),u.hp+h); fxNum(u,'+'+h,'#6f6'); } } break; }
     case 'heal': { let amt; if(ab.pct) amt=Math.round(maxHP(tg)*ab.pct); else amt=Math.round(healPower(u)*ab.p); healUnit(tg,amt); if(ab.cure) cureAll(tg); if(ab.st) applyStatus(tg,ab.st[0],1,ab.st[2]); if(ab.buf) applyMods(tg,ab.buf,ab.dur); sfx('heal'); break; }
     case 'cure': cureAll(tg); bLog(`✨ ${tg.name} is cured.`); sfx('heal'); break;
     case 'revive': break;
     case 'buff': applyMods(tg,ab.buf,ab.dur); if(ab.st) applyStatus(tg,ab.st[0],1,ab.st[2]); fxNum(tg,'▲','#8cf'); break;
     case 'debuff': applyMods(tg,ab.buf,ab.dur); fxNum(tg,'▼','#f8a'); bLog(`${tg.name} is weakened.`); break;
     case 'status': tryStatus(tg,ab.st); break;
     case 'cover': uSt(tg).coveredBy=u.id; uSt(tg).cover=ab.dur; bLog(`🤝 ${u.name} guards ${tg.name}.`); break;
     case 'steal': doSteal(u,tg); break;
     case 'scan': G.known[tg.id]=1; applyMods(tg,ab.buf,ab.dur); bLog(`🔍 ${tg.name}: ${foeIntel(tg).replace(/<br>/g,' ')}`); break;
     case 'gravity': { if(immune(tg,'gravity')){ bLog('No effect.'); break; } const d=Math.max(1,Math.floor(tg.hp*(tg.boss?0.1:ab.p))); dmgUnit(tg,d,'#d8f'); fxBurst(tg,'dark'); break; }
     case 'focus': { const m=Math.round(maxMP(u)*0.3); u.mp=Math.min(maxMP(u),u.mp+m); fxNum(u,'+'+m+' MP','#8cf'); break; }
    } if(targets.length>1) await wait(90); }
  if(ab.e==='revive'){ const tg=t; if(tg&&!uAlive(tg)){ tg.hp=Math.max(1,Math.round(maxHP(tg)*ab.p)); tg._st={}; bLog(`✨ ${tg.name} is back on their feet!`); sfx('heal'); fxNum(tg,'+'+tg.hp,'#6f6'); } else bLog('…but nobody needs reviving.'); } }
function healPower(u){ const w=u.eq&&u.eq.weapon&&ITEMS[u.eq.weapon]; const m=(w&&w.heal)||1; return (stat(u,'spi')*1.5+cMag(u)*0.6+8)*m; }
async function useItemOn(it,t){ if(it.dmg){ for(const f of liveFoes()){ const d=Math.max(1,Math.round(it.dmg*elMult(f,it.el))); fxBurst(f,it.el); dmgUnit(f,d,'#fff'); } return; }
  if(it.revive){ if(t&&!uAlive(t)){ t.hp=Math.max(1,Math.round(maxHP(t)*it.revive)); t._st={}; bLog(`✨ ${t.name} revives!`); sfx('heal'); } return; }
  if(!t||!uAlive(t)) return; if(it.heal) healUnit(t,it.heal); if(it.mpheal){ const m=Math.min(it.mpheal,maxMP(t)-t.mp); t.mp+=m; fxNum(t,'+'+m+' MP','#8cf'); } if(it.cure) for(const s of it.cure) delete uSt(t)[s]; sfx('heal'); }
function healUnit(t,amt){ const before=t.hp; t.hp=Math.min(uMax(t),t.hp+amt); fxNum(t,'+'+(t.hp-before),'#6f6'); }
function cureAll(t){ const st=uSt(t); for(const s of ['poison','sleep','stun','silence','blind','slow']) delete st[s]; }
function applyMods(t,buf,dur){ const m=uMods(t); for(const k in buf){ const cur=m[k]; const v=buf[k]; if(!cur||Math.abs(v-1)>=Math.abs(cur.m-1)||(v>1)!==(cur.m>1)) m[k]={m:v,t:dur}; else cur.t=Math.max(cur.t,dur); } }
function tryStatus(t,st){ const [s,ch,turns]=st; if(!uAlive(t)) return; if(immune(t,s)){ bLog(`${t.name} is immune to ${STATUS_INFO[s][1].toLowerCase()}.`); return; }
  let p=ch; if(isFoe(t)&&t.boss&&['sleep','stun','silence','blind','slow'].includes(s)) p*=0.4; if(!['haste','regen','counter','evade','taunt'].includes(s)) p*=isFoe(t)?1:clamp(1-stat(t,'spi')*0.008,0.5,1);
  if(chance(p)) applyStatus(t,s,1,turns); else bLog(`${t.name} resists.`); }
function applyStatus(t,s,_,turns){ uSt(t)[s]=Math.max(uSt(t)[s]||0,turns); fxNum(t,STATUS_INFO[s][0],'#ff8'); const good=['haste','regen','counter','evade','taunt'].includes(s); bLog(`${STATUS_INFO[s][0]} ${t.name}: ${STATUS_INFO[s][1]}${good?'':'!'}`); }
function doSteal(u,t){ if(!isFoe(t)) return; if(t.stolen){ bLog(`${t.name} has nothing left to steal.`); return; } const p=clamp(0.45+(uSpd(u)-uSpd(t))*0.03,0.2,0.9); if(chance(p)){ t.stolen=true; invAdd(t.E.steal); bLog(`🫳 ${u.name} stole <b>${ITEMS[t.E.steal].n}</b>!`); sfx('chest'); } else bLog(`🫳 ${u.name} couldn't steal anything.`); }
function coverFor(t){ if(isFoe(t)) return t; const st=uSt(t); if(st.cover&&st.coveredBy){ const g=G.chars[st.coveredBy]; if(g&&uAlive(g)&&g!==t){ bLog(`🤝 ${g.name} takes the blow for ${t.name}!`); return g; } } return t; }
async function physHit(u,t,o){ if(!t||!uAlive(t)) return 0; if(!isFoe(t)) t=coverFor(t);
  const ust=uSt(u), tst=uSt(t); let hit=o.sure?1:0.95; if(ust.blind) hit*=0.45; if(tst.evade) hit*=0.3; if(!isFoe(t)) hit*=clamp(1-stat(t,'agi')*0.004,0.8,1);
  if(isFoe(u)){ u.lunge=6; sfx('ehit'); } else fxSlash(t);
  if(!chance(hit)){ bLog(`${u.name} misses ${t.name}.`); fxNum(t,'miss','#aaa'); sfx('miss'); await wait(200); return 0; }
  let atk=uAtk(u)*o.p; if(!isFoe(u)&&u.row==='back'&&!o.ranged) atk*=0.6; if(!isFoe(t)&&t.row==='back'&&isFoe(u)) atk*=0.65;
  let d=atk-(o.pierce?0:uDef(t)*0.5); d=Math.max(1,d)*rnd(0.9,1.1); d*=elMult(t,o.el); if(tst.defend) d*=0.5;
  let crit=false; if(o.crit||chance((isFoe(u)?0.05:cCrit(u))+(o.critAdd||0))){ d*=1.5; crit=true; }
  d=Math.round(d); if(o.el&&elMult(t,o.el)===0){ bLog(`${t.name} is unharmed by ${ELEMS[o.el]}.`); fxNum(t,'0','#aaa'); return 0; }
  dmgUnit(t,d,crit?'#ffd040':isFoe(t)?'#fff':'#f66'); if(crit) bLog(`💥 Critical! ${d} to ${t.name}.`); else bLog(`${u.name} hits ${t.name} for ${d}.`); if(o.el&&isFoe(t)&&elMult(t,o.el)>1){ bLog(`It's weak to ${ELEMS[o.el]}!`); G.known[t.id]=G.known[t.id]||0.5; }
  sfx(crit?'crit':'hit');
  // counters
  if(uAlive(t)&&uAlive(u)&&(tst.counter||(!isFoe(t)&&t.cls==='brawler'&&chance(0.15)))&&!o.isCounter&&isFoe(u)!==isFoe(t)){ await wait(220); bLog(`↩ ${t.name} counters!`); await physHit(t,u,{p:0.9,el:isFoe(t)?null:weaponEl(t),ranged:true,isCounter:true}); }
  return d; }
async function magHit(u,t,p,el){ if(!t||!uAlive(t)) return 0; let m=uMag(u)*p*1.3; const w=!isFoe(u)&&u.eq.weapon&&ITEMS[u.eq.weapon]; if(w&&w.boost&&w.boost===el) m*=1.25;
  let d=Math.max(1,m-uRes(t)*0.5)*rnd(0.9,1.1); const em=elMult(t,el); d*=em; if(uSt(t).defend) d*=0.7; d=Math.round(d); fxBurst(t,el);
  if(em===0){ bLog(`${t.name} is immune to ${ELEMS[el]}!`); fxNum(t,'0','#aaa'); if(isFoe(t)) G.known[t.id]=G.known[t.id]||0.5; return 0; }
  dmgUnit(t,d,isFoe(t)?'#fff':'#f66'); bLog(`${t.name} takes ${d}${el?' '+ELEMS[el].split(' ')[0]:''}${em>1?' — weak spot!':em<1?' (resisted)':''}.`); if(isFoe(t)&&em!==1) G.known[t.id]=G.known[t.id]||0.5; return d; }
function dmgUnit(t,d,col){ t.hp=Math.max(0,t.hp-d); fxNum(t,d,col); if(isFoe(t)){ t.shake=8; t.flash=2; } const st=uSt(t); if(st.sleep&&d>0){ delete st.sleep; bLog(`${t.name} wakes up!`); } if(t.hp<=0) onKO(t); bRenderParty(); }
function onKO(t){ if(isFoe(t)){ t.dying=14; sfx('ko'); bLog(`✖ ${t.name} is defeated.`); } else { t._st={}; t._mods={}; bLog(`✖ <span class="bad">${t.name} falls!</span>`); sfx('ko'); } }
function pickPartyTarget(){ const alive=liveParty(); const taunt=alive.filter(c=>uSt(c).taunt); if(taunt.length&&chance(0.85)) return pick(taunt);
  const w=alive.map(c=>c.row==='back'?1:3); let r=Math.random()*w.reduce((a,b)=>a+b,0); for(let i=0;i<alive.length;i++){ r-=w[i]; if(r<=0) return alive[i]; } return alive[0]; }
async function enemyAct(f){ if(f.E.shift&&B.round%3===0&&!f._shifted){ f._shifted=B.round; }
  let acts=f.E.acts.slice(); const foes=liveFoes();
  acts=acts.filter(([a])=>{ if(a==='heal_ally') return foes.some(o=>o.hp<o.maxhp*0.6); if(a==='summon_clerk') return foes.length<3; if(a==='silence') return liveParty().some(c=>!uSt(c).silence&&abilities(c).some(x=>AB[x].k==='spell')); return true; });
  if(uSt(f).silence) acts=acts.filter(([a])=>{ const A=EACT[a]; return !A||A.e!=='mag'&&A.e!=='heal'&&A.e!=='status'; });
  if(!acts.length) acts=[['attack',1]]; let tot=acts.reduce((s,a)=>s+a[1],0), r=Math.random()*tot, act='attack'; for(const [a,w] of acts){ r-=w; if(r<=0){ act=a; break; } }
  const A=EACT[act]; if(!A){ return; }
  if(A.e==='shift'){ const els=['fire','ice','volt','holy','dark'].filter(e=>e!==f.shiftEl); f.shiftEl=pick(els); bLog(`🔷 ${f.name} refracts — its light turns ${ELEMS[f.shiftEl]}.`); sfx('magic'); return; }
  if(A.t==='summon'){ const nf=mkFoe(A.summon); B.foes.push(nf); bLayout(); bLog(`${f.name} uses ${A.name}: a ${nf.name} rises!`); sfx('magic'); return; }
  if(A.e==='heal'){ const tg=foes.sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0]; const amt=Math.round(uMag(f)*A.p*1.6); bLog(`${f.name} uses ${A.name}.`); healUnit(tg,amt); sfx('heal'); return; }
  if(A.e==='buff'){ for(const o of foes) applyMods(o,A.buf,A.dur); bLog(`${f.name} uses ${A.name}. Monsters harden their guard.`); return; }
  bLog(`${f.name}: ${A.name==='Attack'?'attacks':A.name}`); if(A.e==='mag') sfx('emagic');
  const el=A.elFromShift?pick(['fire','ice','volt','holy','dark'].filter(e=>e!==f.shiftEl)):A.el;
  const targets=(A.t==='all'?liveParty():[pickPartyTarget()]).filter(Boolean);
  for(const t of targets){ if(!uAlive(t)) continue; if(A.e==='phys') await physHit(f,t,{p:A.p}); else if(A.e==='mag') await magHit(f,t,A.p,el); if(A.st&&uAlive(t)) tryStatus(t,A.st); if(A.e==='status') tryStatus(t,A.st); }
  if(f.E.shift&&B.round%3===0&&chance(0.5)){ f.shiftEl=pick(['fire','ice','volt','holy','dark'].filter(e=>e!==f.shiftEl)); bLog(`🔷 ${f.name} shimmers — now ${ELEMS[f.shiftEl]}.`); } }
function endOfRound(){ const all=[...liveParty(),...liveFoes()]; for(const u of all){ const st=uSt(u); delete st.defend;
    if(st.poison){ const d=Math.max(1,Math.round(uMax(u)*(isFoe(u)?(u.boss?0.03:0.07):0.07))); u.hp=Math.max(isFoe(u)?0:1,u.hp-d); fxNum(u,d,'#a6f'); if(u.hp<=0) onKO(u); }
    if(st.regen){ const h=Math.round(uMax(u)*0.08); u.hp=Math.min(uMax(u),u.hp+h); fxNum(u,'+'+h,'#6f6'); }
    for(const k of Object.keys(st)){ if(k==='coveredBy'||k==='stun') continue; if(typeof st[k]==='number'){ st[k]--; if(st[k]<=0) delete st[k]; } } if(!st.cover) delete st.coveredBy;
    const m=uMods(u); for(const k of Object.keys(m)){ m[k].t--; if(m[k].t<=0) delete m[k]; } }
  bRenderParty(); }
async function checkEnd(){ if(!B) return true; if(!liveFoes().length){ // phase 2?
    const ph=B.foes.find(f=>f.E.phase2&&!f.phased); if(ph){ ph.phased=true; await wait(600); await bossPhase2(ph); return false; }
    await wait(500); await victory(); return true; }
  if(!liveParty().length){ await wait(600); await defeat(); return true; } return false; }
async function bossPhase2(f){ bLog('The light gathers…'); sfx('boss'); await talk(null,['<b>Archon Veyl</b>: "You think you have won? I AM the sun now!"','Veyl tears the shards from his chest. The false sun ignites!']); const nf=mkFoe(f.E.phase2); B.foes=[nf]; bLayout(); playMusic('boss'); bLog(`☀ <b>${nf.name}</b> appears!`); }
async function victory(){ const foes=B.foes; let xp=0,gold=0; const drops=[]; for(const f of foes){ xp+=f.E.xp; gold+=f.E.gold; if(f.E.drop&&chance(f.E.drop[1])) drops.push(f.E.drop[0]); }
  if(hasScout()) gold=Math.round(gold*1.15); gold=Math.round(gold*rnd(0.9,1.1)); G.gold+=gold; for(const d of drops) invAdd(d); for(const f of foes) G.seenFoes[f.id]=1;
  const lines=[]; const ups=[]; for(const id of G.roster){ const c=G.chars[id]; const active=G.party.includes(id); const share=active&&c.hp>0?1:BENCH_XP; const u=gainXP(c,xp*share); if(u.length) ups.push([c,u]); }
  sfx('win'); playMusic('victory');
  for(const [c,u] of ups){ const last=u[u.length-1]; const learned=u.flatMap(x=>x.learned).map(a=>AB[a].name); lines.push(`⭐ <b>${escapeHtml(c.name)}</b> reached <b>Lv ${last.lv}</b> (+${PTS_PER_LV*u.length} stat points)${learned.length?` · learned <b>${learned.join(', ')}</b>`:''}${G.party.includes(c.id)?'':' <span class="dim">(bench)</span>'}`); }
  const html=`<h2>Victory!</h2><p>+<b>${fmt(xp)}</b> XP each · +<b>${fmt(gold)}</b> gold${drops.length?` · found ${drops.map(d=>'<b>'+ITEMS[d].n+'</b>').join(', ')}`:''}</p>${lines.length?'<div class="ups">'+lines.join('<br>')+'</div>':''}<p class="dim">Benched and fallen members get ${Math.round(BENCH_XP*100)}% XP.</p>`;
  await say(html,'Continue'); const r=B.res; const opts=B.opts; cleanupBattle(); r('win');
  if(!opts.noLevelPrompt) await levelPrompts(); }
async function defeat(){ const opts=B.opts; const r=B.res; if(opts.arena){ cleanupBattle(); for(const c of partyChars()) if(c.hp<=0) c.hp=1; await say('<h2>Defeated</h2><p>You are carried out of the arena pit. No harm done — try again when you are stronger.</p>'); r('lose'); return; }
  sfx('gameover'); playMusic('gameover');
  const v=await ask(`<h2>Your party has fallen…</h2><p>You can wake up at the last inn you visited (${TOWNS[G.lastInn].name}). You keep your items and experience but lose half your gold.</p>`,[{label:'Wake up at the inn',value:'inn',cls:'primary'},{label:'Load a save',value:'load'}]);
  cleanupBattle();
  // "Load a save": never leave (or autosave) a fallen party. Saving is paused until a save is loaded; backing out of the menu wakes you at the inn.
  if(v==='load'){ const g=G; g._downed=1; g.noSave=true; r('lose'); openLoadMenu(true,()=>{ if(G===g&&g._downed){ delete g._downed; g.noSave=false; wakeAtInn(); } }); return; }
  r('lose'); wakeAtInn(); }
function wakeAtInn(){ G.gold=Math.floor(G.gold/2); restParty(true); G.mode='world'; G.dpos=null; const T=TOWNS[G.lastInn]; G.pos={x:T.x,y:T.y+1}; enterTown(G.lastInn); log('You wake at the inn, bruised but alive.'); }
function endBattle(how){ const r=B.res; cleanupBattle(); r(how); }
function cleanupBattle(){ for(const c of rosterChars()){ delete c._st; delete c._mods; } B=null; $('battle').classList.add('hidden'); document.body.classList.remove('inbattle'); playMusic(G.mode==='dungeon'?'dungeon':G.mode==='town'?'town':'world'); refreshHUD(); redraw(); }
function bRenderParty(){ const el=$('b-party'); if(!el||!B) return; el.innerHTML=partyChars().map(c=>{ const st=c._st||{}; const icons=Object.keys(st).filter(k=>st[k]>0&&STATUS_INFO[k]).map(k=>`<span title="${STATUS_INFO[k][1]}">${STATUS_INFO[k][0]}</span>`).join('');
  const mods=c._mods||{}; const mi=Object.keys(mods).map(k=>`<span class="${mods[k].m>1?'good':'bad'}">${k}${mods[k].m>1?'▲':'▼'}</span>`).join(' ');
  return `<div class="bcard ${B.cur===c?'cur':''} ${c.hp<=0?'ko':''}" data-id="${c.id}">${portraitHtml(c.id,'xs')}<div class="bci"><b>${escapeHtml(c.name)}${c.row==='back'?' <span class="dim" title="Back row">· back</span>':''}</b><div class="hpbar"><i style="width:${c.hp/maxHP(c)*100}%"></i></div><div class="nums">${c.hp}/${maxHP(c)}</div><div class="mpbar"><i style="width:${maxMP(c)?c.mp/maxMP(c)*100:0}%"></i></div><div class="nums mp">${c.mp} MP</div><div class="sti">${icons} ${mi}</div></div></div>`; }).join(''); }

function itemSummary(id){ const it=ITEMS[id]; const b=[]; if(it.atk) b.push('ATK '+it.atk); if(it.mag) b.push('MAG '+it.mag); if(it.def) b.push('DEF '+it.def); if(it.res) b.push('RES '+it.res);
  for(const s of STATS) if(it[s]) b.push(s.toUpperCase()+' +'+it[s]); if(it.mp) b.push('MP +'+it.mp); if(it.spd) b.push('SPD '+(it.spd>0?'+':'')+it.spd); if(it.wt) b.push(`<span class="bad">Weight ${it.wt}</span>`); if(it.crit) b.push('Crit +'+Math.round(it.crit*100)+'%');
  if(it.two) b.push('<span class="dim">two-handed</span>'); if(it.ranged) b.push('<span class="good">ranged</span>'); if(it.el) b.push(ELEMS[it.el]); if(it.cls) b.push(it.cls+' armor'); if(it.ty) b.push(it.ty);
  if(it.note) b.push(`<span class="good">${it.note}</span>`); if(it.desc&&it.s!=='weapon') b.push(it.desc); return b.join(' · '); }
function whoCanUse(id){ const it=ITEMS[id]; if(!['weapon','armor','shield','acc'].includes(it.s)) return ''; return partyChars().map(c=>{ const ok=canEquip(c,id); if(!ok) return `<span class="who no" title="${equipReason(c,id)}">${portraitHtml(c.id,'xs')}✕</span>`;

  return `<span class="who">${portraitHtml(c.id,'xs')}${worn?'<span class="dim">worn</span>':parts.join(' ')||'<span class="dim">=</span>'}</span>`; }).join(''); }
function openShop(kind){ const T=TOWNS[G.town]; const list=T.shop[kind]; const title={weapon:'⚔ Weapon Smith',armor:'🛡 Armorer',item:'🧪 Goods & Trinkets'}[kind];
  const body=()=>`${sceneImg('in_'+kind)}<p class="dim">Gold: <b class="gold">${fmt(G.gold)}</b>. Tap an item to buy. ▲▼ show how it would change each party member.</p>${list.map(id=>{ const it=ITEMS[id]; const own=G.inv[id]||0; return `<button class="btn lrow shoprow" data-b="${id}" ${G.gold<it.price?'disabled':''}><b>${it.n}</b> <span class="cost">${fmt(it.price)}g</span>${own?` <span class="dim">(have ${own})</span>`:''}<br><span class="dim">${itemSummary(id)}</span><div class="whos">${whoCanUse(id)}</div></button>`; }).join('')}`;
  const p=panel(title,body()); const bind=()=>p.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>buyDialog(b.dataset.b,()=>{ p.refresh(null,body()); bind(); })); bind(); }
async function buyDialog(id,after){ const it=ITEMS[id]; const gearSlot=['weapon','armor','shield','acc'].includes(it.s);
  const opts=[]; if(gearSlot){ for(const c of partyChars()) if(canEquip(c,id)) opts.push({label:`Buy & equip on ${c.name}`,value:'eq:'+c.id,cls:'primary',dis:G.gold<it.price}); opts.push({label:`Buy (${it.price}g)`,value:'1',dis:G.gold<it.price}); }
  else { for(const n of [1,3,5]) opts.push({label:`Buy ${n} (${it.price*n}g)`,value:String(n),cls:n===1?'primary':'',dis:G.gold<it.price*n}); }
  opts.push({label:'Cancel',value:null}); const v=await ask(`<h3>${it.n}</h3><p>${itemSummary(id)}</p>`,opts); if(!v) return;
  if(v.startsWith('eq:')){ G.gold-=it.price; invAdd(id); const c=G.chars[v.slice(3)]; equip(c,id); sfx('buy'); toast(`${c.name} equips ${it.n}.`); }
  else { const n=+v; G.gold-=it.price*n; invAdd(id,n); sfx('buy'); toast(`Bought ${n} ${it.n}.`); } refreshHUD(); after&&after(); }
function sellPrice(id){ const it=ITEMS[id]; return Math.floor((it.price||200)/2); }
function openSell(){ const body=()=>{ const ids=Object.keys(G.inv).filter(id=>ITEMS[id].s!=='key'); if(!ids.length) return '<p class="dim">Nothing to sell. Gear your party wears is not listed; unequip it first.</p>';
    return `<p class="dim">Gold: <b class="gold">${fmt(G.gold)}</b>. Shops pay half price. Unique treasures cannot be bought back!</p>`+ids.map(id=>`<button class="btn lrow" data-s="${id}"><b>${ITEMS[id].n}</b> ×${G.inv[id]} <span class="cost">+${sellPrice(id)}g</span>${ITEMS[id].unique?' <span class="bad">unique</span>':''}<br><span class="dim">${itemSummary(id)}</span></button>`).join(''); };
  const p=panel('💰 Sell',body()); const bind=()=>p.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.s; const it=ITEMS[id]; const v=await ask(`<p>Sell <b>${it.n}</b> for ${sellPrice(id)} gold?${it.unique?' <span class="bad">It is unique — you can\'t get another.</span>':''}</p>`,[{label:'Sell',value:1,cls:'primary'},{label:'Keep',value:0}]); if(v){ invAdd(id,-1); G.gold+=sellPrice(id); sfx('buy'); refreshHUD(); p.refresh(null,body()); bind(); } }); bind(); }

// ---- temple: change paths (costly) ----
function openTemple(){ const body=()=>`${sceneImg('in_temple')}<p>"The stars allow a soul to walk back one step — for a price."</p>
  ${rosterChars().map(c=>{ const last=c.disc?'disc':c.path?'path':null; const costP=160*c.lv, costS=40*c.lv; const spent=STATS.reduce((a,s)=>a+(c.alloc[s]||0),0);
    return `<div class="card">${portraitHtml(c.id,'xs')} <b>${escapeHtml(c.name)}</b> <span class="dim">Lv ${c.lv} ${cls(c).name}${c.path?' · '+pathOf(c).name:''}${c.disc?' · '+DISCIPLINES[c.disc].name:''}</span>
     <div class="row"><button class="btn" data-u="${c.id}" ${!last||G.gold<costP?'disabled':''}>Unbind ${last==='disc'?'discipline':'path'} — ${fmt(costP)}g</button><button class="btn" data-r="${c.id}" ${!spent||G.gold<costS?'disabled':''}>Return stat points — ${fmt(costS)}g</button></div></div>`; }).join('')}
  ${G.town==='vessa'&&!G.flags.donated?`<div class="card"><b>Offering box</b><p class="dim">Give 100 gold to the temple's soup kitchen.</p><button class="btn" id="tp-don" ${G.gold<100?'disabled':''}>Donate 100g</button></div>`:''}
  <p class="dim">Unbinding removes the latest path or discipline and the skills it taught; you choose again right away. Gold is not refunded.</p>`;
  const p=panel('⛪ Temple of the Seven Stars',body()); const bind=()=>{ p.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{ const c=G.chars[b.dataset.u]; const cost=160*c.lv; const what=c.disc?DISCIPLINES[c.disc].name:pathOf(c).name;
      const v=await ask(`<p>Unbind <b>${c.name}</b> from <b>${what}</b> for ${fmt(cost)} gold?</p>`,[{label:'Unbind',value:1,cls:'primary'},{label:'Cancel',value:0}]); if(!v) return; G.gold-=cost; if(c.disc) c.disc=null; else c.path=null; c.respecs++; clampHPMP(c); sfx('magic'); refreshHUD(); await levelPrompts(); p.refresh(null,body()); bind(); });
    p.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const c=G.chars[b.dataset.r]; const cost=40*c.lv; G.gold-=cost; let n=0; for(const s of STATS){ n+=c.alloc[s]||0; c.alloc[s]=0; } c.pts+=n; clampHPMP(c); sfx('magic'); toast(`${c.name} has ${c.pts} points to spend again.`); refreshHUD(); p.refresh(null,body()); bind(); });
    const d=p.querySelector('#tp-don'); if(d) d.onclick=()=>{ G.gold-=100; G.flags.donated=1; G.honor++; sfx('heal'); toast('The priests bless you. <b>Honor +1</b>'); refreshHUD(); p.refresh(null,body()); bind(); }; }; bind(); }

// ---- arena ----
function openArena(){ const body=()=>`${sceneImg('bg_arena')}<p>${portraitHtml('pitmaster','sm')} "Blood and sand! Win a bout, win the purse."</p>
   <div class="col"><button class="btn big" data-a="pit">Pit bout — 2 gladiators · prize 300g</button>
   ${!G.chars.tolli?`<button class="btn big primary" data-a="tolli">Champion's challenge — Tolli's pit trio · she joins you if you win</button>`:'<p class="good">Tolli the champion travels with you now.</p>'}
   <button class="btn big" data-a="grand">Grand bout — 3 Shard Knights · prize 1200g</button></div><p class="dim">Losing in the arena costs nothing.</p>`;
  const p=panel('🏟 Qadir Arena',body()); p.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{ const a=b.dataset.a; closeAllPanels();
    const grp=a==='pit'?['gladiator','gladiator']:a==='tolli'?['gladiator','jackal','gladiator']:['shardknight','shardknight','shardknight'];
    const v=await startBattle(grp,{bg:'arena',arena:1,noRun:1}); if(v==='win'){ const prize={pit:300,tolli:400,grand:1200}[a]; G.gold+=prize; toast(`Arena prize: +${prize} gold`);
      if(a==='tolli'&&!G.chars.tolli){ await talk('tolli',['"Ha! You hit like a sandstorm. I have been bored for three years."','"Take me with you. I want to fight something that can actually beat me."']); recruit('tolli'); G.flags.arena_won=1; } }
    refreshHUD(); renderTown(); }); }

// ---- people ----
function townPeople(id){ const F=G.flags; const L=[];
  if(id==='corlan'){ L.push({who:'hesk',label:'Elder Hesk',hot:!F.talked_elder,fn:talkHesk});
    if(!G.chars.brannoc) L.push({who:'brannoc',label:'Brannoc (tavern)',hot:F.talked_elder,fn:talkBrannoc});
    if(!G.chars.pell&&!F.pell_choice) L.push({who:'pell',label:'A commotion in the square',hot:true,fn:talkPell});
    L.push({who:'tamsin',label:'Guard Tamsin',fn:talkTamsin}); if(!F.wick_helped) L.push({who:'beggar',label:'Old Wick',fn:talkWick}); L.push({who:'merchant',label:'Merchant Bree',fn:talkBree}); }
  if(id==='vessa'){ L.push({who:'orrin',label:'Magistrate Orrin',hot:!F.talked_orrin,fn:talkOrrin});
    if(!G.chars.kaz) L.push({who:'kaz',label:'Kaz\'s workshop',hot:invHas('gearcore'),fn:talkKaz});
    if(!G.chars.maren) L.push({who:'maren',label:'Sister Maren (temple steps)',fn:talkMaren});
    if(!G.chars.vex) L.push({who:'vex',label:'Hooded figure at the docks',fn:talkVex});
    if(!F.smuggled) L.push({who:'dace',label:'Dace the Smuggler',fn:talkDace});
    if(!G.chars.pell&&F.pell_choice==='left') L.push({who:'pell',label:'Pell (tavern)',fn:talkPellVessa}); }
  if(id==='qadir'){ L.push({who:'sahra',label:'Emir Sahra',hot:!F.talked_sahra||(F.spire_done&&!F.skiff),fn:talkSahra}); L.push({who:'pitmaster',label:'Pitmaster Gorr',fn:()=>openArena()}); }
  return L; }
function openTalk(){ const people=townPeople(G.town); const p=panel('💬 People of '+TOWNS[G.town].name,people.map((x,i)=>`<button class="btn lrow" data-p="${i}">${portraitHtml(x.who,'sm')} <b>${x.label}</b>${x.hot?' <span class="dot">!</span>':''}</button>`).join(''));
  p.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{ const x=people[+b.dataset.p]; await x.fn(); closePanel(p); questUpdate(); refreshHUD(); renderTown(); }); }
async function talkHesk(){ const F=G.flags;
  if(!F.talked_elder){ await talk('hesk',[`"${escapeHtml(G.hero.name)}! Thank the stars you're back. Since the burning stone fell into Rustvein Mine, monsters crawl out every night."`,'"The miners say the stone is a <b>Sun Shard</b> — a piece of Solmara, our shattered sun. Something down there is feeding on it."','"Brannoc at the tavern lost his brother in that mine. Take him, buy what you need, and end this. The mine is up the road, north-west of town."']); F.talked_elder=1; return; }
  if(!F.mine_done){ await talk('hesk','"The mine is north-west — follow the road. Rest at the inn first, and keep Tonics handy."'); return; }
  await talk('hesk',['"You did it! And the shard… it hums like a heartbeat."','"Rumor says a man called the <b>Archon</b> is gathering the other shards. Cross the bridge to Vessa — Magistrate Orrin will know more."']); }
async function talkBrannoc(){ const v=await talk('brannoc',['A broad man in battered chain mail looks up from his ale.','"Hesk sent you? My brother went into that mine and didn\'t come out. I\'ll hold the line while you swing. Deal?"'],[{label:'"Welcome aboard."',value:1,cls:'primary'},{label:'"Not yet."',value:0}]); if(v){ recruit('brannoc'); G.flags.brannoc=1; tip('party'); } }
async function talkPell(){ const v=await talk('merchant',['A merchant has a scrawny thief by the collar. "This rat stole my apples! Fifty gold or the stocks!"','The boy glances at you. "Name\'s Pell. I can pick locks and spot traps… just saying."'],
   [{label:'Pay his 50g fine (honorable)',value:'paid',cls:'primary',dis:G.gold<50},{label:'Lean on the merchant (ruthless)',value:'threat'},{label:'Walk away',value:'left'}]);
  G.flags.pell_choice=v; if(v==='paid'){ G.gold-=50; G.honor++; await talk('pell','"You paid for me? Nobody does that. I\'m with you."'); recruit('pell'); toast('<b>Honor +1</b>'); }
  else if(v==='threat'){ G.honor--; await talk('pell','"Ha! Did you see his face? I like your style. Count me in."'); recruit('pell'); toast('<b>Honor -1</b>'); }
  else { await talk('pell','Pell twists free and vanishes into the crowd. <span class="dim">(You may meet him again somewhere bigger.)</span>'); } }
async function talkPellVessa(){ const v=await talk('pell',['"Oh. It\'s you. I made it to Vessa on my own, no thanks to you."','"Fine — a hundred and fifty gold and I\'ll guide you. Thieves have to eat."'],[{label:'Pay 150g',value:1,cls:'primary',dis:G.gold<150},{label:'No',value:0}]); if(v){ G.gold-=150; recruit('pell'); } }
async function talkTamsin(){ if(!G.flags.mine_done) await talk('tamsin','"Ferrow Bridge to the east stays shut until those mine monsters are dealt with. Orders."'); else await talk('tamsin','"The bridge is open, hero. Vessa lies east along the road."'); }
async function talkWick(){ const v=await talk('beggar','"Spare a coin for an old miner? Twenty gold buys a week of bread."',[{label:'Give 20g',value:1,cls:'primary',dis:G.gold<20},{label:'Not today',value:0}]); if(v){ G.gold-=20; G.honor++; G.flags.wick_helped=1; invAdd('tonic',2); await talk('beggar','"Bless you. Take these Tonics — I found them in the old shafts. And a tip: the mine\'s guardian hates lightning."'); toast('<b>Honor +1</b> · got 2 Tonics'); } }
async function talkBree(){ await talk('merchant',['"Heavy armor makes you tough but slow, and it dulls a caster\'s spells. Two-handed weapons hit hard but leave no hand for a shield."','"Put casters and archers in the <b>back row</b> — they take less damage there. Swords and fists hit softer from the back."']); }
async function talkOrrin(){ const F=G.flags; if(!F.talked_orrin){ await talk('orrin',['"The hero of Corlan! Welcome to Vessa."','"A second Sun Shard fell into the <b>Sunken Archive</b>, our drowned library on the east shore. The dead walk its stacks now."','"Clear it, and I will open the <b>Sandgate</b> through the northern mountains."']); F.talked_orrin=1; return; }
  if(!F.archive_done){ await talk('orrin','"The Archive is east of the city, past the swamp. Drowned things fear fire and holy light."'); return; }
  await talk('orrin',['"You have our thanks. The Sandgate is open."','"Beyond it lies the desert and the oasis city of <b>Qadir</b>. Emir Sahra has seen strange lights over her spire."']); }
async function talkKaz(){ if(invHas('gearcore')){ await talk('kaz',['"Is that… a GEARCORE? Do you know how rare those are?!"','"With this, my rifle sings. You need a gunner? You have a gunner."']); invAdd('gearcore',-1); recruit('kaz'); return; }
  await talk('kaz',['A woman in goggles waves a wrench. "Careful, that\'s live!"','"I build things that go bang. But my best design needs a <b>Gearcore</b> — the old Archive machines used them. Bring me one and I\'ll join your crew."']); }
async function talkMaren(){ if(G.honor>=1){ const v=await talk('maren',['"I have heard what you did for others. Kindness is rarer than courage."','"Let me walk with you, and heal what the road breaks."'],[{label:'"We would be honored."',value:1,cls:'primary'},{label:'"Not now."',value:0}]); if(v) recruit('maren'); return; }
  await talk('maren',['"Forgive me. I only walk beside those whose deeds speak of mercy."',`<span class="dim">(She joins parties with Honor 1 or more. Yours is ${G.honor}. Helping people raises it.)</span>`]); }
async function talkVex(){ if(G.honor<=-1){ const v=await talk('vex',['"I watched you. You do what must be done, and you don\'t cry about it."','"I have knives and a grudge against the Archon. Want both?"'],[{label:'"Welcome."',value:1,cls:'primary'},{label:'"No."',value:0}]); if(v) recruit('vex'); return; }
  await talk('vex',['A hooded woman doesn\'t look up. "Go save some kittens, hero."',`<span class="dim">(She only joins the ruthless: Honor -1 or less. Yours is ${G.honor}.)</span>`]); }
async function talkDace(){ const v=await talk('dace',['"Psst. I have crates that must leave the docks tonight. No questions."','"Distract the harbor watch, and two hundred gold is yours."'],[{label:'Take the job (ruthless)',value:1},{label:'Refuse',value:0,cls:'primary'}]);
  if(v){ G.flags.smuggled=1; G.honor--; G.gold+=200; toast('+200 gold · <b>Honor -1</b>'); await talk('dace','"Pleasure doing business."'); } }
async function talkSahra(){ const F=G.flags; if(!F.talked_sahra){ await talk('sahra',['"Travelers from the south! You carry two Sun Shards — I can feel them."','"A third fell west of here and grew into the <b>Glass Spire</b>. Its light blinds my people\'s eyes."','"Bring down whatever guards it, and my sky-skiff will carry you to the <b>Starfall Citadel</b> where the Archon waits."','"Glass shrugs off steel — use spells. But the little wisps eat magic; hit those with weapons."']); F.talked_sahra=1; return; }
  if(F.spire_done&&!F.skiff){ await talk('sahra',['"The spire is dark at last. Qadir is in your debt."','"My skiff is yours. It leaves from the pier west of the city, on the inland sea."']); F.skiff=1; sfx('fanfare'); toast('You can now ride the sky-skiff from the pier.'); return; }
  if(!F.spire_done){ await talk('sahra','"The Glass Spire stands across the desert to the west. The northern road leads there."'); return; }
  await talk('sahra','"The skiff waits at the pier, west of the city. May the stars guide you."'); }

// ---- dungeon events ----
async function npcEvent(fl,k){ const st=dState(fl.did,fl.fi); if(fl.spec.npc==='ysolde'){ const v=await talk('ysolde',['A young woman is pinned under a fallen beam, a staff glowing in her hand.','"Don\'t just STAND there. The kobolds will be back any minute. Lift this thing!"'],[{label:'Free her',value:1,cls:'primary'},{label:'Search her pack instead (ruthless)',value:2}]);
    st.npc[k]=1; if(v===2){ G.honor--; invAdd('ether',2); await talk('ysolde','"You… took my Ethers?! Fine. FINE. I\'ll come anyway — you clearly need a brain on this team."'); toast('<b>Honor -1</b> · got 2 Ethers'); }
    else await talk('ysolde','"Ysolde. Arcanist. I came to study the shard and the floor ate me. I\'ll repay you with fire, ice and lightning."');
    recruit('ysolde'); redraw(); } }
async function bossEvent(fl){ const did=fl.did; const boss=fl.spec.boss;
  const intro={mine:['The tunnel opens into a cavern of glowing ore. Something huge uncurls from the rock.','<b>Ironmaw</b> roars, a Sun Shard blazing in its chest!'],
   archive:['Candles float over black water. A robed figure turns a soggy page.','<b>The Drowned Scholar</b>: "Silence in the library!"'],
   spire:['At the crown of the spire, light folds into a giant crystal shape.','<b>The Prism Warden</b> turns, and its color shifts…'],
   citadel:['A throne of fallen stars. A tall man rises, three shards orbiting him.','<b>Archon Veyl</b>: "You brought me the last shards. How thoughtful. I will remake the sun — and it will answer only to me."']}[did];
  await talk(did==='citadel'?'veyl':null,intro); const v=await startBattle([boss],{bg:DUNGEONS[did].bg,boss:1});
  if(v!=='win'){ if(v==='run') stepBack(); return; }
  G.flags[did+'_done']=1; invAdd('shard'); autosaveSoon();
  if(did==='mine'){ await talk(null,['Ironmaw crumbles. You lift a warm, humming <b>Sun Shard</b> from the ore.','<span class="good">The Ferrow Bridge guards will let you pass now.</span> A pillar of light appears to carry you out.']); }
  if(did==='archive'){ await talk(null,['The Scholar sighs and dissolves into ink. Its page holds a second <b>Sun Shard</b>.','<span class="good">Return to Magistrate Orrin — the Sandgate north of Vessa is open.</span>']); }
  if(did==='spire'){ await talk(null,['The Warden shatters into rainbows. Behind it, a woman sleeps inside a crystal: an ancient seer, bound to power the spire.','A lens of pure starlight rests on her brow — the <b>Star-Lens</b>. Removing it would break her bond… and her.']);
    const c=await talk(null,'What do you do?',[{label:'Free her (honorable)',value:'free',cls:'primary'},{label:'Take the Star-Lens (ruthless)',value:'lens'}]);
    if(c==='free'){ G.honor++; await talk('oriel',['"Three hundred years I watched the stars through glass. Thank you."','"I am Oriel. Veyl bound me here. Let me help you end him."']); recruit('oriel'); }
    else { G.honor--; invAdd('star_lens'); await talk(null,'The seer fades with a soft sigh. The <b>Star-Lens</b> is yours (spells +30%).'); }
    await talk(null,'<span class="good">Return to Emir Sahra in Qadir for her sky-skiff.</span>'); }
  if(did==='citadel'){ G.flags.won=1; await ending(); }
  redraw(); questUpdate(); refreshHUD(); }
async function ending(){ playMusic('victory'); await talk(null,['The false sun gutters out. The shards fall from the air and rise again — slowly, gently — toward the sky.',
  'Over the following nights, the people of Solmara watch a new star grow brighter: the sun, healing itself, piece by piece.',
  `<b>${escapeHtml(G.hero.name)}</b> and companions are remembered in Corlan, Vessa and Qadir for generations.`,
  '<h2>The End</h2><p>Thank you for playing <b>Shards of Solmara</b> v${GAME_VERSION}. Your save keeps going — explore, fight in the arena, or try different paths.</p>']); }

function bar(v,max,cls){ return `<div class="sbar ${cls||''}"><i style="width:${max?clamp(v/max*100,0,100):0}%"></i></div>`; }
function openParty(){ const body=()=>`<p class="dim">Tap a member for gear, stats and paths. Order = marching order; the first is the leader on the map.</p>

function openChar(id,after){ const c=G.chars[id]; const p=panel(escapeHtml(c.name),'',{onBack:after}); const render=()=>{ const C=cls(c); const pend=pendingChoice(c);
  const statRow=s=>`<div class="strow"><span class="sname" title="${STAT_TIP[s]}">${STAT_NAME[s]}</span><b>${stat(c,s)}</b>${c.alloc[s]?`<span class="dim">(+${c.alloc[s]})</span>`:''}${c.pts?`<button class="btn small plus" data-plus="${s}">＋</button>`:''}<span class="dim tiny">${STAT_TIP[s]}</span></div>`;

  const nxt=nextAbilities(c).map(([l,a])=>`<div class="ab dim">Lv ${l}: <b>${AB[a].name}</b> — ${AB[a].desc}</div>`).join('');
  p.refresh(`${C.icon} ${escapeHtml(c.name)}`,`<div class="charhead">${portraitHtml(c.id,'lg')}<div><b class="big">${escapeHtml(c.name)}</b><br>Lv ${c.lv} ${C.name} <span class="dim">— ${C.role}</span><br>
    ${c.path?`Path: <b>${pathOf(c).name}</b>`:`<span class="dim">Path at Lv ${PATH_LV}</span>`}${c.disc?` · <b>${DISCIPLINES[c.disc].name}</b>`:c.lv>=PATH_LV?` <span class="dim">· discipline at Lv ${DISC_LV}</span>`:''}
    <div class="hpmp"><span>HP ${c.hp}/${maxHP(c)}</span>${bar(c.hp,maxHP(c),'hp')}<span>MP ${c.mp}/${maxMP(c)}</span>${bar(c.mp,maxMP(c),'mp')}<span>XP ${c.xp}/${xpNeed(c.lv)}</span>${bar(c.xp,xpNeed(c.lv),'xp')}</div></div></div>
    ${COMPANIONS[c.id]?`<p class="dim">${escapeHtml(COMPANIONS[c.id].persona)}</p>`:''}${C.passive?`<p class="good">Passive: ${C.passive}</p>`:''}
    ${pend?`<button class="btn big primary wide" id="ch-choose">⭐ Choose ${pend==='path'?'a path':'a discipline'} now</button>`:''}
    <h3>Stats ${c.pts?`<span class="good">${c.pts} points to spend</span> <button class="btn small" id="ch-auto">Auto-spend</button>`:''}</h3>${STATS.map(statRow).join('')}
    <div class="derived"><span>ATK <b>${cAtk(c)}</b></span><span>MAG <b>${cMag(c)}</b></span><span>DEF <b>${cDef(c)}</b></span><span>RES <b>${cRes(c)}</b></span><span>SPD <b>${cSpd(c)}</b></span><span>Crit <b>${Math.round(cCrit(c)*100)}%</b></span><span>Weight <b class="${weight(c)>2?'bad':''}">${weight(c)}</b></span></div>
    <p class="dim tiny">Every point of armor weight costs 1 speed. Heavy armor also cuts spell power by 15%. Back row: take 35% less physical damage, but melee hits deal 40% less (bows, guns and spells are unaffected).</p>
    <div class="row"><button class="btn" id="ch-row">Row: <b>${c.row==='front'?'Front':'Back'}</b> (tap to switch)</button></div>
    <h3>Equipment</h3>${['weapon','armor','shield','acc'].map(slot).join('')}<p class="dim tiny">Can use: ${C.wpn.join(', ')} · ${C.arm.join('/')} armor${pathOf(c)&&pathOf(c).arm?'/'+pathOf(c).arm.join('/'):''}${C.shield?' · shields':''}</p>
    <h3>Skills & spells</h3>${ab||'<p class="dim">None yet.</p>'}${nxt?`<h3>Coming up</h3>${nxt}`:''}
    <h3>Paths</h3>${pathTreeHtml(c)}`);
  const b=p.body(); b.querySelectorAll('[data-plus]').forEach(x=>x.onclick=()=>{ if(c.pts<=0) return; const ohp=maxHP(c),omp=maxMP(c); c.alloc[x.dataset.plus]=(c.alloc[x.dataset.plus]||0)+1; c.pts--; c.hp+=maxHP(c)-ohp; c.mp+=maxMP(c)-omp; sfx('select'); render(); });
  const au=b.querySelector('#ch-auto'); if(au) au.onclick=()=>{ autoAllocate(c); sfx('ok'); render(); };
  const ch=b.querySelector('#ch-choose'); if(ch) ch.onclick=async()=>{ await choosePrompt(c); render(); };
  b.querySelector('#ch-row').onclick=()=>{ c.row=c.row==='front'?'back':'front'; sfx('select'); render(); };
  b.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>openEquipSlot(c,x.dataset.slot,render)); refreshHUD(); };
  render(); }
function pathTreeHtml(c){ const C=cls(c); return Object.entries(C.paths).map(([k,pa])=>{ const chosen=c.path===k, locked=c.path&&!chosen; const gr=Object.entries(pa.gr).map(([s,v])=>`<span class="${v>0?'good':'bad'}">${s.toUpperCase()} ${v>0?'+':''}${v}/lv</span>`).join(' ');
   return `<div class="card path ${chosen?'chosen':''} ${locked?'locked':''}"><b>${pa.name}</b> ${chosen?'<span class="good">✔ chosen</span>':locked?'<span class="dim">🔒 locked out</span>':''}<br><span class="dim">${pa.desc}</span><br>${gr}${pa.hpL?` <span class="${pa.hpL>0?'good':'bad'}">HP ${pa.hpL>0?'+':''}${pa.hpL}/lv</span>`:''}${pa.arm?' <span class="good">+heavy armor</span>':''}<br>${pa.abil.map(([l,a])=>`Lv ${l} ${AB[a].name}`).join(' · ')}</div>`; }).join('')
   + `<div class="card ${c.disc?'chosen':''}"><b>Discipline (Lv ${DISC_LV})</b>: ${c.disc?`<span class="good">${DISCIPLINES[c.disc].name}</span> — ${DISCIPLINES[c.disc].desc}`:Object.values(DISCIPLINES).map(d=>d.name).join(' / ')+' — pick one'}</div>`; }
function openEquipSlot(c,s,after){ const cur=c.eq[s]; const ids=Object.keys(G.inv).filter(id=>ITEMS[id].s===s);
  const rows=ids.map(id=>{ const ok=canEquip(c,id); const d=ok?previewEquip(c,id):null; const delta=d?['atk','mag','def','res','spd','hp','mp'].filter(k=>d[k]).map(k=>`<span class="${d[k]>0?'good':'bad'}">${k.toUpperCase()}${d[k]>0?'+':''}${d[k]}</span>`).join(' '):'';
    return `<button class="btn lrow" data-e="${id}" ${ok?'':'disabled'}><b>${ITEMS[id].n}</b> ×${G.inv[id]} ${delta}<br><span class="dim">${ok?itemSummary(id):equipReason(c,id)}</span></button>`; }).join('');
  const p=panel(`${SLOT_NAME[s]} — ${escapeHtml(c.name)}`,`${cur?`<p>Wearing: <b>${ITEMS[cur].n}</b> <button class="btn small" id="eq-off">Unequip</button></p>`:'<p class="dim">Nothing equipped.</p>'}${rows||'<p class="dim">No spare items for this slot. Buy some in town or find them in dungeons.</p>'}`,{onBack:after});
  const off=p.querySelector('#eq-off'); if(off) off.onclick=()=>{ unequip(c,s); sfx('select'); closePanel(p); after&&after(); };
  p.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ equip(c,b.dataset.e); sfx('ok'); closePanel(p); after&&after(); }); }

async function choosePrompt(c){ const pend=pendingChoice(c); if(!pend) return;
  if(pend==='path'){ const C=cls(c); const opts=Object.entries(C.paths).map(([k,pa])=>({label:`<b>${pa.name}</b><br><small>${pa.desc}<br>${Object.entries(pa.gr).map(([s,v])=>`${s.toUpperCase()} ${v>0?'+':''}${v}/lv`).join(' · ')}${pa.hpL?` · HP ${pa.hpL>0?'+':''}${pa.hpL}/lv`:''}${pa.arm?' · can wear heavy armor':''}<br>Learns: ${pa.abil.map(([l,a])=>`${AB[a].name} (Lv ${l})`).join(', ')}</small>`,value:k,cls:'pathopt'}));
    opts.push({label:'Decide later',value:null}); const v=await ask(`<h2>${escapeHtml(c.name)}: choose a path</h2>${portraitHtml(c.id,'sm')}<p>${C.name}s split into two paths at Lv ${PATH_LV}. <b>The other path is locked out.</b> <span class="dim">(A temple can unbind it later for a lot of gold.)</span></p>`,opts,'choice');
    if(v){ const ohp=maxHP(c), omp=maxMP(c); c.path=v; c.hp+=Math.max(0,maxHP(c)-ohp); c.mp+=Math.max(0,maxMP(c)-omp); clampHPMP(c); sfx('levelup'); toast(`${c.name} walks the path of the <b>${C.paths[v].name}</b>.`); } return v; }
  const opts=Object.entries(DISCIPLINES).map(([k,d])=>({label:`<b>${d.name}</b><br><small>${d.desc}</small>`,value:k,cls:'pathopt'})); opts.push({label:'Decide later',value:null});
  const v=await ask(`<h2>${escapeHtml(c.name)}: choose a discipline</h2><p>At Lv ${DISC_LV} every hero masters one discipline. Each has a cost. Only one can be chosen.</p>`,opts,'choice');
  if(v){ c.disc=v; clampHPMP(c); sfx('levelup'); toast(`${c.name} masters <b>${DISCIPLINES[v].name}</b>.`); } return v; }
async function levelPrompts(){ for(const c of rosterChars()){ while(pendingChoice(c)){ const v=await choosePrompt(c); if(!v) break; } } refreshHUD(); }

async function fieldUse_v01(id){ const it=ITEMS[id];
  if(it.field==='escape'){ if(G.mode!=='dungeon'){ toast('Only works inside a dungeon.'); return; } invAdd(id,-1); closeAllPanels(); sfx('magic'); leaveDungeon(); return; }
  if(it.field==='tent'){ const ok=G.mode==='world'||(G.mode==='dungeon'&&dCell(curFloor(),G.dpos.x,G.dpos.y)==='R'); if(!ok){ toast('Pitch a tent on the overworld (or at a dungeon spring).'); return; } invAdd(id,-1); restParty(); sfx('inn'); toast('You camp for the night. Everyone is rested.'); autosave(); refreshHUD(); return; }
  const pool=it.revive?partyChars().filter(c=>c.hp<=0):partyChars().filter(c=>c.hp>0); if(!pool.length){ toast(it.revive?'Nobody has fallen.':'Nobody can use that.'); return; }
  const v=await ask(`<p>Use <b>${it.n}</b> on…</p>`,pool.map(c=>({label:`${escapeHtml(c.name)} — HP ${c.hp}/${maxHP(c)} · MP ${c.mp}/${maxMP(c)}`,value:c.id})).concat([{label:'Cancel',value:null}])); if(!v) return;
  const c=G.chars[v]; invAdd(id,-1); if(it.revive){ c.hp=Math.max(1,Math.round(maxHP(c)*it.revive)); } if(it.heal) c.hp=Math.min(maxHP(c),c.hp+it.heal); if(it.mpheal) c.mp=Math.min(maxMP(c),c.mp+it.mpheal); sfx('heal'); toast(`${c.name} uses ${it.n}.`); refreshHUD(); }
function openCamp(){ if(G.mode!=='world'){ toast('Make camp on the overworld.'); return; } const p=panel('⛺ Camp',`<p>You make camp off the road.</p><div class="col"><button class="btn big" id="cp-tent" ${invHas('tent')?'':'disabled'}>Pitch a Tent (full rest) — have ${G.inv.tent||0}</button>
   <button class="btn big" id="cp-swap">👥 Swap party members</button><button class="btn big" id="cp-save">💾 Save</button></div><p class="dim">Tents are sold in every town.</p>`);
  p.querySelector('#cp-tent').onclick=async()=>{ await fieldUse('tent'); closePanel(p); }; p.querySelector('#cp-swap').onclick=()=>openPartySwap(); p.querySelector('#cp-save').onclick=()=>openSaveMenu(); }

function currentGoal(){ const F=G.flags;
  if(!F.talked_elder) return {text:'Talk to <b>Elder Hesk</b> in Corlan. (In town tap 💬 Talk.)',town:'corlan',x:TOWNS.corlan.x,y:TOWNS.corlan.y};
  if(!G.chars.brannoc) return {text:'Recruit <b>Brannoc</b> — tap 💬 Talk in Corlan and pick him.',town:'corlan',x:TOWNS.corlan.x,y:TOWNS.corlan.y};
  if(!F.mine_done){ const D=DUNGEONS.mine; return {text:'Clear <b>Rustvein Mine</b>, north-west of Corlan up the road. Defeat its guardian on the lower floor.',hint:'Buy gear first (⚔ Weapons, 🛡 Armor). Find the Rusted Key to open the locked door. Ironmaw is weak to ⚡ Volt.',x:D.x,y:D.y}; }
  if(!F.visited_vessa) return {text:'The <b>Ferrow Bridge</b> is open. Go east to the harbor city of <b>Vessa</b>.',x:TOWNS.vessa.x,y:TOWNS.vessa.y};
  if(!F.talked_orrin) return {text:'Speak with <b>Magistrate Orrin</b> in Vessa (💬 Talk).',town:'vessa',x:TOWNS.vessa.x,y:TOWNS.vessa.y};
  if(!F.archive_done){ const D=DUNGEONS.archive; return {text:'Explore the <b>Sunken Archive</b> east of Vessa and defeat the Drowned Scholar.',hint:'Drowned things fear 🔥 Fire and ✨ Holy. Tide Sprites heal other monsters — hit them first.',x:D.x,y:D.y}; }
  if(!F.visited_qadir) return {text:'The <b>Sandgate</b> north of Vessa is open. Cross the mountain pass to the desert city of <b>Qadir</b>.',x:TOWNS.qadir.x,y:TOWNS.qadir.y};
  if(!F.talked_sahra) return {text:'Meet <b>Emir Sahra</b> in Qadir (💬 Talk).',town:'qadir',x:TOWNS.qadir.x,y:TOWNS.qadir.y};
  if(!F.spire_done){ const D=DUNGEONS.spire; return {text:'Climb the <b>Glass Spire</b> in the western desert and break its Warden.',hint:'Glass Golems resist weapons; Prism Wisps resist spells. The Warden\'s weakness changes — Analyze it or watch its ring color.',x:D.x,y:D.y}; }
  if(!F.skiff) return {text:'Return to <b>Emir Sahra</b> in Qadir for the sky-skiff.',town:'qadir',x:TOWNS.qadir.x,y:TOWNS.qadir.y};
  if(!F.citadel_done){ const onIsle=G.pos&&wZone(G.pos.x,G.pos.y)==='isle'; const D=DUNGEONS.citadel; return {text:onIsle?'Storm the <b>Starfall Citadel</b> and defeat Archon Veyl.':'Ride the sky-skiff from the <b>pier west of Qadir</b> to the Citadel isle.',hint:'Veyl has two forms. The second one fears ❄️ Ice and drinks 🔥 Fire.',x:onIsle?D.x:82,y:onIsle?D.y:30}; }
  return {text:'You saved Solmara! Keep exploring, try the arena, or start a new game with other choices.'}; }

function openHelp(){ panel('❓ How to play',`<h3>Goal</h3><p>Recover the four Sun Shards and stop Archon Veyl. Follow the 📜 goal at the top of the screen; on the world map the gold arrow points the way.</p>

// ---------------- saves: autosave, 3 slots, export/import, migration ----------------
const SAVE_VERSION=3;
const SLOT_KEY=i=>PREFIX+'slot'+i, AUTO_KEY=PREFIX+'auto';
function serialize(){ const keep=JSON.parse(JSON.stringify(G,(k,v)=>k.startsWith('_')?undefined:v)); keep.v=SAVE_VERSION; keep.game=GAME_VERSION; keep.ts=Date.now(); for(const k of TRANSIENT_KEYS) delete keep[k]; if(!['world','town','dungeon'].includes(keep.mode)) keep.mode='world'; return keep; }
// runtime-only flags (input locks etc.) must never be saved or restored: a save taken mid-step once kept busy=true and froze the party
const TRANSIENT_KEYS=['busy','moving','locked','inBattle','transition','menuOpen','pending','noSave'];
function summary(s){ if(!s) return null; const h=s.chars&&s.chars.hero; const where=s.mode==='dungeon'&&s.dpos?DUNGEONS[s.dpos.did].name:s.mode==='town'&&s.town?TOWNS[s.town].name:'World map';
  return `${escapeHtml(h?h.name:'?')} Lv ${h?h.lv:'?'} · ${where} · ${fmt(s.gold||0)}g · ${new Date(s.ts||0).toLocaleString()}`; }
function readSave(key){ try{ const s=localStorage.getItem(key); return s?JSON.parse(s):null; }catch(e){ return null; } }
function writeSave(key){ try{ localStorage.setItem(key,JSON.stringify(serialize())); return true; }catch(e){ toast('Could not save: '+e.message); return false; } }
function autosave(){ if(!G||G.mode==='title'||B||G.noSave) return; writeSave(AUTO_KEY); }
let _as=null; function autosaveSoon(){ clearTimeout(_as); _as=setTimeout(()=>{ if(!B) autosave(); else autosaveSoon(); },800); }
// migrations: each step upgrades one version. Old saves always load.
const MIGRATIONS={
 0:s=>{ // pre-release fixtures: no honor, no known, party list stored as 'members'
   if(s.members&&!s.party) s.party=s.members; delete s.members; if(s.honor==null) s.honor=0; s.known=s.known||{}; s.seenFoes=s.seenFoes||{}; s.flags=s.flags||{}; s.inv=s.inv||{}; s.dun=s.dun||{};
   for(const id in (s.chars||{})){ const c=s.chars[id]; c.alloc=c.alloc||{str:0,int:0,agi:0,vit:0,spi:0}; c.bonus=c.bonus||{}; c.eq=c.eq||{weapon:null,armor:null,shield:null,acc:null}; if(c.pts==null) c.pts=0; if(!c.row) c.row='front'; if(c.respecs==null) c.respecs=0; }
   s.v=1; return s; },
 1:s=>{ // v0.2: hero hair/skin swatches become one of six painted portraits (closest match)
   const pickPic=l=>{ if(!l||l.pic) return l&&l.pic; let best=1,bd=1e9; for(const h of HERO_LOOKS){ const a=rgbOf(l.hair||'#553'), b=rgbOf(h.hair), c=rgbOf(l.skin||'#d8a878'), d=rgbOf(h.skin);
     const dist=Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])+1.3*Math.hypot(c[0]-d[0],c[1]-d[1],c[2]-d[2])+(!!l.long!==!!h.long?40:0); if(dist<bd){ bd=dist; best=h.pic; } } return best; };
   const hc=s.chars&&s.chars.hero; const look=(hc&&hc.look)||(s.hero&&s.hero.look); if(look){ const pic=pickPic(look); if(hc&&hc.look) hc.look.pic=pic; if(s.hero&&s.hero.look) s.hero.look.pic=pic; }
   s.v=2; return s; },
 2:s=>{ // v0.2 big map: the 48x40 world became the 144x112 main continent (old x,y -> 2x+24, 2y+14)
   const T=p=>p&&p.x!=null?{x:p.x*2+24,y:p.y*2+14}:p; s.pos=T(s.pos); s.cont='main'; s.deep=s.deep||{};
   for(const did of ['mine','archive','spire','citadel']){ if(s.dun&&(s.dun[did+'1'])) s.deep[did]=1; else if(s.dun&&s.dun[did+'0']) s.deep[did]=0; }
   s.wseen=''; s._revealFrom=1; s.v=3; return s; },
};
function migrate(s){ let v=s.v||0; let n=0; while(v<SAVE_VERSION&&MIGRATIONS[v]&&n<20){ s=MIGRATIONS[v](s); v=s.v; n++; } return s; }
function validate(s){ for(const k of TRANSIENT_KEYS) delete s[k]; if(!['world','town','dungeon'].includes(s.mode)) s.mode='world'; if(!s.chars||!s.chars.hero) throw new Error('save has no hero');
  if(!s.flags) s.flags={}; if(!s.inv) s.inv={}; if(!s.dun) s.dun={}; if(s.gold==null||!isFinite(s.gold)) s.gold=0; if(typeof s.encSteps!=='number'||!isFinite(s.encSteps)||s.encSteps<4||s.encSteps>60) s.encSteps=12; if(!s.log) s.log=[]; if(s.steps==null) s.steps=0; if(s.walkF==null) s.walkF=0;
  if(!s.roster) s.roster=Object.keys(s.chars); s.party=(s.party||[]).filter(id=>s.chars[id]); if(!s.party.length) s.party=[s.roster[0]]; s.party=s.party.slice(0,MAX_PARTY);
  for(const id in s.chars){ const c=s.chars[id]; for(const sl in c.eq) if(c.eq[sl]&&!ITEMS[c.eq[sl]]) c.eq[sl]=null; if(c.path&&!CLASSES[c.cls].paths[c.path]) c.path=null; if(c.disc&&!DISCIPLINES[c.disc]) c.disc=null; }
  for(const k in s.inv) if(!ITEMS[k]) delete s.inv[k];
  if(s.mode==='dungeon'&&(!s.dpos||!DUNGEONS[s.dpos.did]||!DUNGEONS[s.dpos.did].floors[s.dpos.fi])){ s.mode='world'; s.dpos=null; }
  if(s.mode==='town'&&!TOWNS[s.town]) s.mode='world';
  if(s.mode==='dungeon'){ const G0=G; try{ G=s; const fl=buildFloor(s.dpos.did,s.dpos.fi); const c=dCell(fl,s.dpos.x,s.dpos.y); const bad=c==='#'||dSolid(c)||!Number.isInteger(s.dpos.x)||!Number.isInteger(s.dpos.y); if(bad){ s.dpos.x=fl.start.x; s.dpos.y=fl.start.y; s.dpos.f=firstOpenDir(fl,fl.start.x,fl.start.y); } if(![0,1,2,3].includes(s.dpos.f)) s.dpos.f=firstOpenDir(fl,s.dpos.x,s.dpos.y); }catch(e){ s.mode='world'; s.dpos=null; } finally{ G=G0; } }
  // a save of a fallen party (written by v0.2.2/v0.2.3 while the "Load a save" menu was open after a defeat) would start every battle with nobody able to act: stand the party back up
  { const ps=s.party.map(id=>s.chars[id]).filter(Boolean); for(const c of ps){ if(typeof c.hp!=='number'||!isFinite(c.hp)) c.hp=0; if(typeof c.mp!=='number'||!isFinite(c.mp)) c.mp=0; }
    if(ps.length&&ps.every(c=>c.hp<=0)){ const G0=G; try{ G=s; for(const c of ps) c.hp=Math.max(1,Math.ceil(maxHP(c)*0.5)); }catch(e){ for(const c of ps) c.hp=Math.max(1,c.hp); } finally{ G=G0; } s._revived=1; } }
  if(s.mode!=='dungeon') s.dpos=null; if(s.pos&&(!Number.isInteger(s.pos.x)||!Number.isInteger(s.pos.y)||s.pos.x<0||s.pos.y<0||s.pos.x>=WW||s.pos.y>=WH)) s.pos=null;
  if(!s.pos||!wPassable.call(null,s.pos.x,s.pos.y)){ const T=TOWNS[s.lastInn]||TOWNS.corlan; s.pos={x:T.x,y:T.y+1}; }
  if(!TOWNS[s.lastInn]) s.lastInn='corlan'; s.cont=s.cont||'main'; s.deep=s.deep||{};
  if(s._revealFrom||!s.wseen){ delete s._revealFrom; const a=new Uint8Array(WW*WH); if(s.wseen) wsUnpack(s.wseen,a); s._ws=a; const G0=G; G=s; for(const id in TOWNS) if(s.flags['visited_'+id]) wReveal(TOWNS[id].x,TOWNS[id].y,9); for(const did in s.deep) if(DUNGEONS[did]) wReveal(DUNGEONS[did].x,DUNGEONS[did].y,6); if(s.pos) wReveal(s.pos.x,s.pos.y,8); s.wseen=wsPack(a); G=G0; } return s; }
function loadState(obj){ let s=migrate(JSON.parse(JSON.stringify(obj))); const prev=G; G=s; try{ validate(G); }catch(e){ G=prev; throw e; }
  // clear every runtime lock so the party can always move after a load
  G.busy=false; if(B){ try{ cleanupBattle(); }catch(e){} B=null; } $('battle').classList.add('hidden'); CAM.a=null; VIEW.flash=0; VIEW.dirty=true; if(typeof AS!=='undefined'){ AS.pre=null; clearTimeout(AS.timer); } { const t=$('tipcard'); if(t) t.classList.add('hidden'); }
  closeAllPanels(); closeAllModals(); $('title').classList.add('hidden'); $('town').classList.add('hidden'); for(const c of rosterChars()) clampHPMP(c);
  if(G.mode==='town') enterTown(G.town); else if(G.mode==='dungeon'){ playMusic('dungeon'); } else { G.mode='world'; playMusic('world'); }
  refreshHUD(); questUpdate(); redraw();
  if(G._revived){ delete G._revived; setTimeout(()=>toast('Your party had fallen in this save, so they are back on their feet at half health.',4200),900); } }
function openSaveMenu(){ if(B){ toast('Finish the battle first.'); return; } const body=()=>[1,2,3].map(i=>{ const s=readSave(SLOT_KEY(i)); return `<button class="btn lrow" data-s="${i}"><b>Slot ${i}</b><br><span class="dim">${s?summary(s):'Empty'}</span></button>`; }).join('')+`<p class="dim">Autosave (separate, never touches these slots): ${summary(readSave(AUTO_KEY))||'none yet'}</p>`;
  const p=panel('💾 Save game',body()); const bind=()=>p.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{ const i=b.dataset.s; if(readSave(SLOT_KEY(i))){ const v=await ask(`<p>Overwrite slot ${i}?</p>`,[{label:'Overwrite',value:1,cls:'primary'},{label:'Cancel',value:0}]); if(!v) return; }
    if(writeSave(SLOT_KEY(i))){ sfx('ok'); toast(`Saved to slot ${i}.`); autosave(); } p.refresh(null,body()); bind(); }); bind(); }
function openLoadMenu(fromDefeat,onCancel){ const rows=[['auto','Autosave',(typeof readAuto==='function'?readAuto():readSave(AUTO_KEY))],...[1,2,3].map(i=>['slot'+i,'Slot '+i,readSave(SLOT_KEY(i))])];
  const p=panel('📂 Load game',`${rows.map(([k,l,s])=>`<button class="btn lrow" data-l="${k}" ${s?'':'disabled'}><b>${l}</b><br><span class="dim">${s?summary(s):'Empty'}</span></button>`).join('')}
   <h3>Backup file</h3><p class="dim">Export saves all slots into one file (keep it in Files or iCloud). Import asks before replacing anything.</p>
   <div class="row"><button class="btn" id="ld-exp">⬆ Export saves</button><button class="btn" id="ld-imp">⬇ Import saves</button></div>`,{onBack:fromDefeat&&!G?showTitle:(onCancel||null)});
  p.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ const k=b.dataset.l; const s=k==='auto'?(typeof readAuto==='function'?readAuto():readSave(AUTO_KEY)):readSave(SLOT_KEY(k.slice(4))); if(!s) return; try{ loadState(s); toast('Game loaded.'); }catch(e){ toast('That save could not be loaded: '+e.message); } });
  p.querySelector('#ld-exp').onclick=exportSaves; p.querySelector('#ld-imp').onclick=pickImport; }
function exportSaves(){ const bundle={format:'solmara-saves',version:SAVE_VERSION,game:GAME_VERSION,ts:Date.now(),auto:readSave(AUTO_KEY),autoPrev:readSave(PREFIX+'auto_prev'),slots:[1,2,3].map(i=>readSave(SLOT_KEY(i)))};
  if(!bundle.auto&&!bundle.slots.some(Boolean)){ toast('No saves to export yet.'); return; } const txt=JSON.stringify(bundle); const name='solmara-saves-'+new Date().toISOString().slice(0,10)+'.json';
  const blob=new Blob([txt],{type:'application/json'}); window._lastExport=txt;
  try{ const f=new File([blob],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:GAME_TITLE+' saves'}).catch(()=>{}); toast('Choose "Save to Files" to keep your backup.'); return; } }catch(e){}
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500); toast('Backup saved: '+name); }
function importBundle(obj){ if(!obj||obj.format!=='solmara-saves') throw new Error('This is not a Shards of Solmara backup.'); const n=(obj.auto?1:0)+(obj.slots||[]).filter(Boolean).length; if(!n) throw new Error('The backup is empty.');
  return ask(`<h3>Import ${n} save(s)?</h3><p class="bad">This replaces the autosave and slots on this device that the backup contains.</p>`,[{label:'Import',value:1,cls:'primary'},{label:'Cancel',value:0}]).then(v=>{ if(!v) return false;
    if(obj.auto) localStorage.setItem(AUTO_KEY,JSON.stringify(obj.auto)); (obj.slots||[]).forEach((s,i)=>{ if(s) localStorage.setItem(SLOT_KEY(i+1),JSON.stringify(s)); }); toast('Saves imported.'); return true; }); }
function pickImport(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json,text/plain'; inp.id='import-input'; inp.style.display='none'; document.body.appendChild(inp);
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return; try{ const obj=JSON.parse(await f.text()); if(await importBundle(obj)){ closeAllPanels(); openLoadMenu(); } }catch(e){ toast('Import failed: '+e.message); } }; inp.click(); }

// ---------------- phone: map pinch-zoom, PWA, layout ----------------
// Native pinch-zoom is allowed on every screen (viewport is user-scalable). Only the
// overworld canvas uses its own two-finger pinch, which zooms the map instead of the page.
function setupMapPinch(){ const cv=$('cv'); let pin=null;
  const d2=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  cv.addEventListener('touchstart',e=>{ if(G&&G.mode==='world'&&e.touches.length===2){ pin={d:d2(e.touches),z:VIEW.zoom}; e.preventDefault(); } },{passive:false});
  cv.addEventListener('touchmove',e=>{ if(pin&&e.touches.length===2){ e.preventDefault(); const z=pin.z*d2(e.touches)/pin.d; VIEW.zoom=clamp(z,0.6,2.5); redraw(); } },{passive:false});
  const end=e=>{ if(pin&&e.touches.length<2){ prefSet('wzoom',VIEW.zoom.toFixed(2)); pin=null; } }; cv.addEventListener('touchend',end); cv.addEventListener('touchcancel',end);
  // iOS Safari also sends gesture events; only swallow them over the world map
  ['gesturestart','gesturechange'].forEach(t=>cv.addEventListener(t,e=>{ if(G&&G.mode==='world'){ e.preventDefault(); if(t==='gesturechange'&&!pin&&e.scale){ VIEW.zoom=clamp((VIEW._gz||VIEW.zoom)*e.scale,0.6,2.5); redraw(); } else if(t==='gesturestart') VIEW._gz=VIEW.zoom; } },{passive:false}));
  cv.addEventListener('gestureend',()=>{ VIEW._gz=null; prefSet('wzoom',VIEW.zoom.toFixed(2)); });
  cv.addEventListener('wheel',e=>{ if(G&&G.mode==='world'){ e.preventDefault(); setZoom(VIEW.zoom*(e.deltaY<0?1.1:0.9)); } },{passive:false}); }
function setCanvasTouch(){ const cv=$('cv'); if(cv) cv.style.touchAction=G&&G.mode==='world'?'none':'manipulation'; }
function setupPWA(){ try{ if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(()=>{}); }catch(e){}
  try{ const u=new URL(location.href); if(u.searchParams.get('reset')==='layout'){ resetPhoneDefaults(); u.searchParams.delete('reset'); history.replaceState(null,'',u.pathname); } }catch(e){} }
document.addEventListener('pointerdown',()=>audUnlock(),{capture:true});
document.addEventListener('dblclick',e=>{ if(e.target.closest&&e.target.closest('.btn')) e.preventDefault(); });

const AUD={ctx:null,unlocked:false,master:null,mus:null,fx:null,track:null,timer:null,step:0,next:0,want:null};
function audMuted(){ return prefGet('mute','off')==='on'; }
function audUnlock(){ if(AUD.unlocked&&AUD.ctx){ if(AUD.ctx.state==='suspended'&&!audMuted()) AUD.ctx.resume().catch(()=>{}); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){}

function parseTrack(s){ return s.trim().split(/\s+/).reduce((out,tok)=>{ if(tok==='-') return out; const [n,l]=tok.split('/'); out.push([n==='-'?null:n,+l||1]); return out; },[]); }

function playMusic(name,force){ AUD.want=name; if(!AUD.ctx||!AUD.unlocked) return; if(AUD.track===name&&!force) return; stopMusic(); AUD.track=name; const T=getTrack(name); const e8=60/T.bpm/2;
  const ch=[{seq:T.L,i:0,t:AUD.ctx.currentTime+0.08,wave:T.wave,vol:0.55,oct:1},{seq:T.Bs,i:0,t:AUD.ctx.currentTime+0.08,wave:'triangle',vol:0.9,oct:1}];

function tone(f,t,d,wave,vol,dest,slide){ if(!AUD.ctx||!f) return; const o=AUD.ctx.createOscillator(), g=AUD.ctx.createGain(); o.type=wave||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);

function noise(t,d,vol,hp){ if(!AUD.ctx) return; const n=Math.floor(AUD.ctx.sampleRate*d); const buf=AUD.ctx.createBuffer(1,n,AUD.ctx.sampleRate); const data=buf.getChannelData(0); for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);

   case 'door': tone(140,t,0.12,'sawtooth',0.25,null,80); noise(t+0.05,0.1,0.15,600); break; case 'chest': [523,659,784,1046].forEach((f,i)=>tone(f,t+i*0.07,0.12,'square',0.3)); break;
   case 'hit': noise(t,0.1,0.5,500); tone(160,t,0.08,'square',0.25,null,60); break; case 'ehit': noise(t,0.12,0.5,300); tone(110,t,0.1,'sawtooth',0.3,null,50); break; case 'crit': noise(t,0.15,0.7,400); tone(880,t,0.1,'square',0.3,null,220); break;
   case 'miss': tone(600,t,0.1,'triangle',0.2,null,300); break; case 'magic': case 'emagic': tone(n==='magic'?400:200,t,0.35,'square',0.22,null,n==='magic'?1600:800); tone(800,t+0.05,0.3,'triangle',0.2,null,1200); break; case 'skill': tone(300,t,0.12,'square',0.25,null,700); break;
   case 'heal': [523,659,784,988].forEach((f,i)=>tone(f,t+i*0.06,0.18,'triangle',0.3)); break; case 'ko': tone(400,t,0.4,'square',0.3,null,60); break;
   case 'win': case 'fanfare': [523,523,523,659,784,1046].forEach((f,i)=>tone(f,t+i*0.09,0.14,'square',0.28)); break; case 'levelup': [392,523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*0.07,0.16,'square',0.3)); break;

   case 'encounter': for(let i=0;i<8;i++) tone(200+i*90,t+i*0.03,0.05,'square',0.18); break; case 'run': for(let i=0;i<5;i++) tone(800-i*120,t+i*0.04,0.05,'square',0.18); break;

const IMG={}; let ASSETS_DONE=false;
function loadImg(n){ return new Promise(r=>{ if(IMG[n]) return r(IMG[n]); const im=new Image(); im.decoding='async'; im.onload=()=>{ IMG[n]=im; r(im); }; im.onerror=()=>r(null); im.src='assets/'+n+'.webp'; }); }
// critical art first (title + portraits), then the rest in the background. Every drawer falls back to procedural art.
async function loadAssets(onProg,onCrit){ const crit=ASSETS.filter(n=>n==='title'||n.startsWith('pt_')), rest=ASSETS.filter(n=>!crit.includes(n)); let done=0; const tot=ASSETS.length;
  const step=()=>{ done++; onProg&&onProg(done/tot); };
  const to=new Promise(r=>setTimeout(r,6000));
  await Promise.race([Promise.all(crit.map(n=>loadImg(n).then(step))),to]); onCrit&&onCrit();
  const bg=Promise.all(rest.map(n=>loadImg(n).then(step))).then(()=>{ ASSETS_DONE=true; window.__assetsDone=true; for(const k in TEXD) delete TEXD[k]; redraw(); });
  return bg; }
function assetUrl(n){ return IMG[n]?'assets/'+n+'.webp':null; }

function rgbOf(hex){ let c=hex.replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join(''); return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; }
function noiseFill(x,X,Y,W,H,cols,n,sz,R){ for(let i=0;i<n;i++){ x.fillStyle=cols[Math.floor(R()*cols.length)]; x.fillRect(X+Math.floor(R()*W),Y+Math.floor(R()*H),sz||1,sz||1); } }

// =================== view loop / dispatch ===================
const DW=320, DH=280, OW=512, OH=448;
function viewLoop(t){ requestAnimationFrame(viewLoop); if(!G||G.mode==='title') return; if(document.hidden) return; const anim=camAnimating(t);
  const idle=G.mode==='dungeon'?66:110; if(!anim&&!VIEW.dirty&&t-VIEW.last<idle) return;
  const dt=t-VIEW.last; VIEW.last=t; VIEW.dirty=false; VIEW.anim=Math.floor(t/550)%2; VIEW.t=t; const t0=performance.now(); drawView(); VIEW.ms=performance.now()-t0; fpsTick(t,dt); }
function fpsTick(t,dt){ const F=VIEW.fps||(VIEW.fps={n:0,t0:t,val:0,worst:0}); F.n++; if(t-F.t0>=1000){ F.val=Math.round(F.n*1000/(t-F.t0)); F.n=0; F.t0=t; } window.__viewMs=VIEW.ms; }
function drawView(){ if(!G||!G.pos) return; const cv=VIEW.cv; const dun=G.mode==='dungeon'; const w=dun?DW:OW, h=dun?DH:OH; if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; VIEW.buf=null; }
  const x=VIEW.x; x.imageSmoothingEnabled=false; if(dun) drawDungeon(x); else drawWorld(x);
  if(VIEW.flash>0){ x.fillStyle=`rgba(255,255,255,${VIEW.flash})`; x.fillRect(0,0,w,h); VIEW.flash=Math.max(0,VIEW.flash-0.15); VIEW.dirty=true; } }

// ---- smooth camera (dungeon steps/turns and overworld walking) ----
const CAM={a:null};
function camPose(){ if(G.mode==='dungeon') return {x:G.dpos.x+0.5,y:G.dpos.y+0.5,a:[-Math.PI/2,0,Math.PI/2,Math.PI][G.dpos.f]}; return {x:G.pos.x,y:G.pos.y,a:0}; }
function camNow(t){ const tgt=camPose(); const A=CAM.a; if(!A) return tgt; const k=clamp((t-A.t0)/A.dur,0,1); if(k>=1&&A.kind!=='bump'){ return tgt; }
  const e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  if(A.kind==='bump'){ const s=Math.sin(k*Math.PI)*0.12; return {x:tgt.x+Math.cos(tgt.a)*s,y:tgt.y+Math.sin(tgt.a)*s,a:tgt.a}; }
  let da=tgt.a-A.from.a; while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI; if(A.turn180) da=Math.PI*(da<0?-1:1);
  return {x:A.from.x+(tgt.x-A.from.x)*e,y:A.from.y+(tgt.y-A.from.y)*e,a:A.from.a+da*e,bob:A.walk?Math.sin(k*Math.PI)*1:0}; }
function camAnimating(t){ const A=CAM.a; if(!A) return false; if(t-A.t0>A.dur){ CAM.a=null; VIEW.dirty=true; return false; } return true; }
function camStart(kind,dur,opts){ const now=performance.now(); const from=CAM.a?camNow(now):camPose(); CAM.a={kind,from,t0:now,dur:window.__fast?1:dur,...(opts||{})}; VIEW.dirty=true; }
function camWait(){ if(window.__fast||!CAM.a) return Promise.resolve(); return new Promise(r=>setTimeout(r,Math.max(0,CAM.a.t0+CAM.a.dur-performance.now()))); }

// =================== v0.2.1 painted overworld ===================
// The overworld is baked into 256px chunks (8x8 tiles) the first time they come into view:
// organic terrain edges, beaches and water depth from a distance field, roads, bridges and
// y-sorted painted trees/mountains/props. Only the water, foam, towns, hero and ambient life
// are drawn every frame, so it stays cheap on a phone.
const OWV={chunks:new Map(),CH:8,SZ:256,max:48,trail:[],last:null,mapImg:null};
function _oh(ix,iy,s){ let h=(ix*374761393+iy*668265263+s*1442695041)|0; h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }

function pnoise(x,y,per,s){ const ix=Math.floor(x), iy=Math.floor(y); const fx=x-ix, fy=y-iy; const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy); const m=v=>((v%per)+per)%per;

// ---- terrain classes ----
// 0 water 1 fields 2 greywold 3 southfold 4 coast 5 fen 6 forest floor 7 rock 8 sand 9 glass 10 ash 11 swamp 12 isle 13 beach 14 wet beach 15 dark shore 16 lilac shore
const OW_BEACH={1:13,2:13,3:13,4:13,5:15,6:13,7:15,8:13,9:16,10:15,11:15,12:16};
function owPrep(){ if(OWV.cls) return; const N=WW*WH; const C=new Uint8Array(N), R=new Array(N);
  const grassOf={fields:1,greywold:2,southfold:3,coast:4,fen:5,cinder:10,desert:8,glass:9,isle:12};
  for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){ const t=wTile(x,y), reg=wRegion(x,y), i=y*WW+x; R[i]=reg; let c;
    if(t==='~'||t==='b'||t==='k') c=0; else if(t==='a') c=10; else if(t==='s') c=11; else if(t==='i') c=12;
    else if(t==='d'||t==='c') c=reg==='glass'?9:reg==='cinder'?15:8; else if(t==='^') c=reg==='cinder'?10:7;
    else if(t==='f') c=(reg==='desert'||reg==='glass')?grassOf[reg]:(reg==='cinder'?10:6);

  for(let gy=0;gy<GH;gy++) for(let gx=0;gx<GW;gx++){ const w=C[((gy/F)|0)*WW+((gx/F)|0)]===0; const i=gy*GW+gx; dIn[i]=w?INF:0; dOut[i]=w?0:INF; }

    for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){ const i=y*GW+x; let v=D[i]; if(!v) continue;
      if(x>0) v=Math.min(v,D[i-1]+a); if(y>0){ v=Math.min(v,D[i-GW]+a); if(x>0) v=Math.min(v,D[i-GW-1]+b); if(x<GW-1) v=Math.min(v,D[i-GW+1]+b); } D[i]=v; }

      if(x<GW-1) v=Math.min(v,D[i+1]+a); if(y<GH-1){ v=Math.min(v,D[i+GW]+a); if(x<GW-1) v=Math.min(v,D[i+GW+1]+b); if(x>0) v=Math.min(v,D[i+GW-1]+b); } D[i]=v; } };

function owSD(u,v){ const F=OWV.F, GW=OWV.GW, GH=OWV.GH; const gx=u*F-0.5, gy=v*F-0.5; const ix=Math.floor(gx), iy=Math.floor(gy); const fx=gx-ix, fy=gy-iy;
  const g=(x,y)=>(x<0||y<0||x>=GW||y>=GH)?3:OWV.sd[y*GW+x]; const a=g(ix,iy), b=g(ix+1,iy), c=g(ix,iy+1), d=g(ix+1,iy+1); return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy; }

function owReg(x,y){ if(x<0||y<0||x>=WW||y>=WH) return 'coast'; return OWV.reg[y*WW+x]; }

// =================== v0.2.2 robust autosave ===================
// One dedicated autosave slot (sos_auto, plus the previous copy in sos_auto_prev in case a write is cut off).
// Manual slots are never written here. Saves happen on area changes, battle wins, shop/inn/equip/level-up

// state from just before the battle is saved instead, so a save can never land mid-fight.

function asCore(s){ const c={...s}; for(const k of ['ts','pos','steps','wseen','encSteps','walkF','log','dun','_lastReg']) delete c[k]; if(c.dpos) c.dpos={did:c.dpos.did,fi:c.dpos.fi}; return JSON.stringify(c); }

function autosave(reason,opt){ opt=opt||{}; if(!G||G.mode==='title'||G.noSave||!G.chars) return false; if(!opt.force&&!asEnabled()) return false;

  if(!opt.quiet) savedIndicator(); return true; }

  el.querySelector('[data-c=run]').onclick=()=>tryRun();
  el.querySelector('[data-c=auto]').onclick=()=>{ const list=choosers(); for(let i=B.ci;i<list.length;i++) B.cmds[i]={actor:list[i],type:'attack',target:foe()}; B.ci=list.length-1; nextChooser(1); }; }
// drawing errors must never stop the battle
{ const bd0=bDraw; let n=0; bDraw=function(){ try{ return bd0.apply(this,arguments); }catch(e){ if(n++<3) errLog('draw',e); } }; }
// Settings → Problem log
function openErrLog(){ let L=[]; try{ L=JSON.parse(localStorage.getItem(ERRLOG_KEY)||'[]'); }catch(_){}
  const p=panel('🩺 Problem log',`${L.length?L.map(x=>`<div class="lrow" style="padding:6px 0;border-bottom:1px solid #334"><b>${new Date(x.t).toLocaleString()}</b> · v${escapeHtml(x.v||'')} · ${escapeHtml(x.where||'')} · ${escapeHtml(x.mode||'')}<br>${escapeHtml(x.msg||'')}<br><span class="dim tiny">${escapeHtml(x.st||'')}</span></div>`).join(''):'<p>No problems recorded. 👍</p>'}
   <p class="dim">If something goes wrong, a screenshot of this page helps fix it fast.</p><div class="row"><button class="btn" id="el-clear">Clear log</button></div>`);
  p.querySelector('#el-clear').onclick=()=>{ try{ localStorage.removeItem(ERRLOG_KEY); }catch(_){} closePanel(p); openErrLog(); }; }
</script>
</body></html>
