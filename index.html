<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Shards of Solmara — an old-school RPG</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solmara">
<meta name="theme-color" content="#120a24">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{ --ink:#f4f0ff; --dim:#a8a8d0; --gold:#f8e070; --good:#7fe8a0; --bad:#ff8a7a; --win:#0c1a5a; --win2:#06103a; --edge:#e8e8ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:#050314; color:var(--ink); font-family:-apple-system,'Segoe UI',Roboto,Verdana,sans-serif; overflow:hidden; touch-action:manipulation; -webkit-text-size-adjust:100%; }
body{ user-select:none; -webkit-user-select:none; }
input{ font-size:16px; padding:8px; border-radius:6px; border:2px solid #8a8ad8; background:#050a30; color:#fff; width:12em; user-select:text; -webkit-user-select:text; }
.hidden{ display:none !important; }
.dim{ color:var(--dim); } .good{ color:var(--good); } .bad{ color:var(--bad); } .gold{ color:var(--gold); } .tiny{ font-size:0.78em; } .center{ text-align:center; }
h1,h2,h3{ font-family:'Trebuchet MS',Verdana,sans-serif; letter-spacing:0.04em; text-shadow:2px 2px 0 #000; }
h2{ color:var(--gold); text-align:center; margin:4px 0 10px; font-size:1.35em; } h3{ color:#c8d0ff; margin:14px 0 6px; font-size:1.02em; }
.btn{ font:inherit; font-weight:600; color:#fff; background:linear-gradient(180deg,#2a3aa8,#141e6a); border:2px solid #c8d0ff; border-radius:7px; padding:8px 12px; min-height:44px; cursor:pointer; text-shadow:1px 1px 0 #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 2px 0 #02041a; touch-action:manipulation; }
.btn:active:not([disabled]),.btn.on{ background:linear-gradient(180deg,#4a5ad8,#2a3aa8); transform:translateY(1px); }
.btn[disabled]{ opacity:0.42; } .btn.primary{ background:linear-gradient(180deg,#b8801a,#6a4208); border-color:#ffe08a; } .btn.small{ min-height:34px; padding:4px 9px; font-size:0.9em; }
.btn.big{ font-size:1.05em; padding:10px 12px; } .btn small{ display:block; font-weight:400; font-size:0.78em; color:#d8dcff; margin-top:2px; }
.win,.panelscr .pbody .card{ background:linear-gradient(180deg,var(--win),var(--win2)); border:2px solid var(--edge); border-radius:8px; box-shadow:inset 0 0 0 2px #3a4aa8,0 6px 18px rgba(0,0,0,0.6); }
#app{ position:fixed; inset:0; display:flex; flex-direction:column; padding:var(--sat) var(--sar) var(--sab) var(--sal); }
#hud{ display:flex; align-items:center; gap:8px; padding:4px 8px; background:linear-gradient(180deg,#141e6a,#0a1040); border-bottom:2px solid #8a8ad8; }
#h-loc{ flex:1; font-weight:700; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:1px 1px 0 #000; } #h-gold{ font-weight:700; }
.hb{ min-height:38px; padding:4px 10px; }
#goalchip{ font:inherit; font-size:0.86em; text-align:left; color:#fff8d0; background:rgba(60,40,0,0.55); border:0; border-bottom:1px solid #6a5a2a; padding:5px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:30px; }
#viewwrap{ position:relative; flex:none; background:#000; display:flex; justify-content:center; }
#cv{ width:100%; max-width:min(100vw, calc((100vh - 400px) * 1.143)); aspect-ratio:256/224; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
#msg{ min-height:3.1em; padding:6px 10px; font-size:0.9em; line-height:1.35; background:linear-gradient(180deg,var(--win),var(--win2)); border-top:2px solid var(--edge); border-bottom:2px solid var(--edge); }
#controls{ flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 10px; min-height:0; }
#dpad{ display:grid; grid-template-areas:". u ." "l . r" ". d ."; grid-template-columns:62px 62px 62px; grid-template-rows:56px 56px 56px; gap:4px; }
.dp{ font-size:22px; padding:0; min-height:0; line-height:1; display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none; }
.dp small{ font-size:10px; margin:0; } .dp.on{ background:linear-gradient(180deg,#5a6ae8,#3a4ab8); }
#acts{ display:grid; grid-template-columns:1fr 1fr; gap:6px; flex:1; max-width:200px; } .act{ min-height:48px; padding:4px; font-size:0.92em; } #b-act{ grid-column:span 2; min-height:54px; font-size:1.05em; }
#partybar{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:4px 6px 6px; background:#080c30; border-top:2px solid #3a4aa8; }
.pcard{ font:inherit; color:#fff; background:linear-gradient(180deg,#18227a,#0a1040); border:1.5px solid #8a8ad8; border-radius:6px; padding:3px; display:grid; grid-template-columns:30px 1fr; grid-template-rows:auto auto auto auto; column-gap:4px; font-size:11px; text-align:left; position:relative; min-height:58px; }
.pcard .port{ grid-row:span 4; } .pcard .pn{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .pcard .pl,.pcard .ph{ font-size:10px; color:var(--dim); } .pcard.ko{ filter:grayscale(1) brightness(0.7); } .pcard.empty{ color:var(--dim); display:flex; align-items:center; justify-content:center; }
.port{ image-rendering:pixelated; border:1.5px solid #c8d0ff; border-radius:4px; background:#000; vertical-align:middle; } .port.xs{ width:28px; height:28px; } .port.sm{ width:44px; height:44px; } .port.lg{ width:96px; height:96px; }
.sbar{ height:5px; background:#000; border-radius:3px; overflow:hidden; margin:1px 0; } .sbar i{ display:block; height:100%; } .sbar.hp i{ background:linear-gradient(90deg,#3ac85a,#9af0a0); } .sbar.mp i{ background:linear-gradient(90deg,#3a6ae8,#8ac8ff); } .sbar.xp i{ background:linear-gradient(90deg,#c89a2a,#f8e070); }
.dot{ display:inline-block; background:#e83a3a; color:#fff; border-radius:9px; font-size:10px; font-style:normal; font-weight:800; padding:0 5px; margin-left:3px; }
/* full-screen panels with a pinned header */
#town,.panelscr{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; background:radial-gradient(ellipse at 50% 0%,#1a2488,#050320 75%); padding:var(--sat) var(--sar) var(--sab) var(--sal); }
#town{ z-index:20; bottom:auto; height:100%; }
.phead{ flex:none; display:flex; align-items:center; gap:6px; padding:6px 8px; background:linear-gradient(180deg,#141e6a,#0a1040); border-bottom:2px solid #8a8ad8; }
.ptitle{ flex:1; text-align:center; font-weight:800; color:var(--gold); text-shadow:1px 1px 0 #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .back{ min-height:42px; padding:4px 10px; flex:none; } .tomap{ font-size:0.82em; }
.pbody{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y pinch-zoom; padding:10px 10px 30px; }
body[data-mode="town"] #town .pbody{ padding-bottom:12px; }
.townbg{ width:100%; image-rendering:pixelated; border:2px solid var(--edge); border-radius:6px; display:block; }
.tgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; } .tb{ text-align:left; min-height:64px; } .goalbox{ margin-top:10px; padding:8px; border:1px solid #8a7a3a; border-radius:6px; background:rgba(60,40,0,0.4); font-size:0.92em; }
.col{ display:flex; flex-direction:column; gap:8px; } .row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; } .row.col{ flex-direction:column; align-items:stretch; }
.lrow{ display:block; width:100%; text-align:left; margin:6px 0; font-weight:400; } .lrow b{ font-weight:700; } .cost{ float:right; color:var(--gold); font-weight:700; }
.card{ padding:8px; margin:8px 0; } .crow{ display:flex; gap:8px; align-items:flex-start; } .cinfo{ flex:1; min-width:0; } .ccol{ display:flex; flex-direction:column; gap:4px; }
.hpmp{ display:grid; grid-template-columns:auto 1fr; gap:2px 6px; align-items:center; font-size:0.82em; margin-top:4px; }
.whos{ display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:4px; } .who{ font-size:0.8em; display:inline-flex; align-items:center; gap:3px; } .who.no{ opacity:0.45; }
.charhead{ display:flex; gap:12px; align-items:center; } .charhead > div{ flex:1; } .big{ font-size:1.2em; }
.strow{ display:grid; grid-template-columns:6.5em 2.2em auto auto; gap:6px; align-items:center; padding:3px 0; border-bottom:1px solid #1e2a7a; } .strow .tiny{ grid-column:1/-1; margin-top:-2px; } .plus{ min-height:32px; }
.derived{ display:flex; flex-wrap:wrap; gap:6px 14px; margin:8px 0; font-size:0.92em; } .ab{ padding:5px 0; border-bottom:1px solid #1e2a7a; } .tag{ font-size:0.72em; color:#c8d0ff; border:1px solid #6a6ab8; border-radius:4px; padding:0 4px; }
.path.chosen,.card.chosen{ border-color:#7fe8a0 !important; } .path.locked{ opacity:0.55; } .card.done{ opacity:0.6; } .wide{ width:100%; margin-top:8px; }
.mapwrap{ text-align:center; } .automap{ max-width:100%; image-rendering:pixelated; border:2px solid var(--edge); } .legend{ font-size:0.8em; display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:center; margin-top:6px; }
.setrow{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #1e2a7a; flex-wrap:wrap; } .seg{ display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.swatch{ width:40px; height:40px; border-radius:50%; border:3px solid #444; } .swatch.on{ border-color:#fff; }
/* modals */
.modal-wrap{ position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; background:rgba(0,0,10,0.55); padding:calc(var(--sat) + 10px) 12px calc(var(--sab) + 10px); }
.modal{ width:min(440px,100%); max-height:100%; overflow-y:auto; touch-action:pan-x pan-y pinch-zoom; padding:14px; line-height:1.45; }
.modal .btn{ width:100%; } .modal .row.col{ margin-top:12px; } .modal.choice .pathopt{ text-align:left; font-weight:400; } .modal .ups{ background:rgba(0,0,0,0.3); padding:8px; border-radius:6px; font-size:0.92em; }
.talk{ display:flex; gap:10px; align-items:flex-start; } .tport .port{ width:64px; height:64px; } .ttext{ flex:1; } .tname{ color:var(--gold); }
#tipcard{ position:fixed; left:10px; right:10px; top:calc(var(--sat) + 80px); z-index:70; padding:12px; background:linear-gradient(180deg,#3a2a08,#1a1204); border:2px solid #f8e070; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.7); line-height:1.4; font-size:0.95em; }
#toast{ position:fixed; left:50%; bottom:calc(var(--sab) + 90px); transform:translateX(-50%) translateY(20px); opacity:0; z-index:90; background:rgba(8,12,48,0.95); border:2px solid var(--gold); border-radius:8px; padding:8px 14px; transition:all .25s; pointer-events:none; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
/* battle */
#battle{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; background:#03020c; padding:var(--sat) var(--sar) var(--sab) var(--sal); }
#bcv{ width:100%; aspect-ratio:256/150; image-rendering:pixelated; flex:none; display:block; max-height:36vh; object-fit:contain; background:#000; }
#b-order{ font-size:0.74em; padding:3px 8px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#060a2a; }
#b-log{ min-height:3.9em; font-size:0.86em; padding:4px 10px; background:linear-gradient(180deg,var(--win),var(--win2)); border-top:2px solid var(--edge); border-bottom:2px solid var(--edge); line-height:1.3; } #b-log .old{ opacity:0.55; font-size:0.92em; }
#b-party{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px 6px; }
.bcard{ position:relative; display:flex; gap:5px; align-items:center; background:linear-gradient(180deg,#18227a,#0a1040); border:1.5px solid #6a6ab8; border-radius:6px; padding:3px 5px; font-size:0.78em; }
.bcard.cur{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(248,224,112,0.5); } .bcard.ko{ filter:grayscale(1) brightness(0.6); } .bcard.hurt{ animation:shake .3s; }
.bci{ flex:1; min-width:0; display:grid; grid-template-columns:1fr auto; column-gap:4px; } .bci b{ grid-column:1/-1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .hpbar,.mpbar{ height:6px; background:#000; border-radius:3px; overflow:hidden; align-self:center; } .hpbar i{ display:block; height:100%; background:linear-gradient(90deg,#3ac85a,#9af0a0); } .mpbar i{ display:block; height:100%; background:linear-gradient(90deg,#3a6ae8,#8ac8ff); }
.nums{ font-size:0.9em; } .nums.mp{ color:#8ac8ff; } .sti{ grid-column:1/-1; font-size:0.9em; min-height:1em; }
.pnum{ position:absolute; left:50%; top:0; transform:translateX(-50%); font-weight:900; font-size:1.3em; text-shadow:1px 1px 0 #000,-1px -1px 0 #000; animation:rise 1s forwards; pointer-events:none; }
@keyframes rise{ from{ opacity:1; transform:translate(-50%,0);} to{ opacity:0; transform:translate(-50%,-26px);} } @keyframes shake{ 25%{ transform:translateX(-4px);} 75%{ transform:translateX(4px);} }
#b-cmd{ flex:1; overflow-y:auto; touch-action:pan-x pan-y pinch-zoom; padding:4px 8px 8px; min-height:0; }
.bwho{ display:flex; align-items:center; gap:6px; margin:2px 0 6px; } .bgrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; } .bgrid .big{ min-height:52px; padding:4px; }
.bsubh{ display:flex; align-items:center; gap:8px; justify-content:space-between; position:sticky; top:-4px; background:#03020c; padding:4px 0; z-index:2; } .bwait{ text-align:center; color:var(--dim); padding:20px; font-size:1.4em; }
/* title */
#title{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 30%,#3a1a5a,#050314 70%); padding:var(--sat) 14px var(--sab); overflow-y:auto; }
.titlebox{ width:min(420px,100%); text-align:center; } .titleart{ width:100%; image-rendering:pixelated; border:2px solid var(--edge); border-radius:8px; }
#title h1{ font-size:2.3em; line-height:1.05; margin:12px 0 4px; color:var(--gold); text-shadow:3px 3px 0 #7a2a0a,0 0 18px rgba(248,180,60,0.5); } .sub{ color:#d8c8f0; margin:0 0 14px; }
body.inbattle #tipcard{ top:auto; bottom:calc(var(--sab) + 12px); }
@media (min-width:700px){ #app{ max-width:520px; margin:0 auto; left:0; right:0; } #town,.panelscr,#battle{ max-width:520px; margin:0 auto; } }
/* ================= v0.2: pixel font, retro frames, painted art ================= */
@font-face{ font-family:'Pixelify'; src:url('assets/fonts/pixelify.woff') format('woff'); font-display:swap; }
h1,h2,h3,.ptitle,#h-loc,#h-gold,.btn.big,.dp,.act,.pcard .pn,.tname,.bname,.cost,#title h1{ font-family:'Pixelify','Trebuchet MS',Verdana,sans-serif; letter-spacing:0.03em; }
h2{ font-size:1.45em; } h3{ font-size:1.1em; }
/* retro double frame: gold outer line, dark gap, bright inner line */
.win,.panelscr .pbody .card,.modal{ border:2px solid #f0d890 !important; border-radius:6px; box-shadow:inset 0 0 0 2px #0a0c30,inset 0 0 0 4px #7a8ae8,0 6px 18px rgba(0,0,0,0.6) !important; }
#msg,#b-log{ border-top:3px double #f0d890; border-bottom:3px double #f0d890; }
.phead,#hud{ background:linear-gradient(180deg,#24308a,#0c1250); border-bottom:3px double #f0d890; }
.btn{ border-color:#d8e0ff; }
.btn.primary{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),0 0 0 1px #4a2a00,0 2px 0 #1a0c00; }
.port.paint{ image-rendering:auto; object-fit:cover; border-color:#f0d890; }
.port.lg{ width:112px; height:112px; } .tport .port{ width:72px; height:72px; }
.sceneart{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border:2px solid #f0d890; border-radius:6px; box-shadow:inset 0 0 0 2px #000; margin:0 0 8px; }
.townbg{ image-rendering:auto; aspect-ratio:16/9; object-fit:cover; border-color:#f0d890; }
#cv{ image-rendering:pixelated; }
#bcv{ image-rendering:auto; aspect-ratio:512/300; }
.lookgrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; } .lookbtn{ padding:3px; min-height:48px; } .lookbtn img{ width:100%; aspect-ratio:1; display:block; border-radius:4px; } .lookbtn.on{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(248,224,112,0.6); }
#title.painted{ background:#050314; }
#title.painted .titleart{ image-rendering:auto; max-height:46vh; object-fit:cover; object-position:50% 30%; }
.loading{ text-align:center; } .loading h1{ color:var(--gold); } .lbar{ width:220px; height:10px; margin:12px auto; border:2px solid #f0d890; border-radius:5px; overflow:hidden; background:#000; } .lbar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#c89a2a,#f8e070); transition:width .2s; }
/* mobile fixes: every tap target at least 44px */
.hb,.back,.btn.small,#goalchip{ min-height:44px; }
.bcard .port{ width:42px; height:42px; flex:none; }
#bcv{ max-height:42vh; }
.btn small{ font-family:-apple-system,'Segoe UI',Roboto,Verdana,sans-serif; letter-spacing:0; }
.sceneart,.townbg{ max-height:38vh; }
/* roomier D-pad on tall phones */
@media (min-height:800px) and (min-width:415px) and (orientation:portrait){ #dpad{ grid-template-columns:68px 68px 68px; grid-template-rows:62px 62px 62px; gap:5px; } .dp{ font-size:26px; } #acts{ max-width:220px; } .act{ min-height:52px; } }
/* ---- phone landscape: view on the left, controls on the right ---- */
@media (orientation:landscape) and (max-height:560px){
  #app{ max-width:none; margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto auto minmax(0,1fr) auto; }
  #hud{ grid-column:1/-1; } #goalchip{ grid-column:1/-1; min-height:44px; padding:4px 10px; }
  #viewwrap{ grid-column:1; grid-row:3/6; align-items:flex-start; }
  #cv{ width:auto; height:calc(100vh - 102px - var(--sat) - var(--sab)); max-width:none; max-height:calc(100vh - 102px - var(--sat) - var(--sab)); }
  #msg{ grid-column:2; grid-row:3; min-height:2.6em; font-size:0.85em; border-top:0; }
  #controls{ grid-column:2; grid-row:4; padding:4px 8px; }
  #partybar{ grid-column:2; grid-row:5; grid-template-columns:repeat(4,minmax(0,1fr)); }
  #partybar .pcard{ min-height:48px; grid-template-columns:24px 1fr; font-size:10px; } #partybar .port.xs{ width:24px; height:24px; }
  #dpad{ grid-template-columns:54px 54px 54px; grid-template-rows:48px 48px 48px; gap:3px; } .dp{ font-size:20px; } .act{ min-height:44px; } #b-act{ min-height:46px; }
  #town,.panelscr,#battle{ max-width:none; }
  #battle{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); grid-template-rows:auto auto auto minmax(0,1fr); }
  #bcv{ grid-column:1; grid-row:1/5; width:100%; height:auto; max-height:calc(100vh - var(--sat) - var(--sab)); align-self:center; }
  #b-order,#b-log,#b-party,#b-cmd{ grid-column:2; } #b-log{ min-height:2.8em; font-size:0.8em; }
  #b-party .bcard .port{ width:32px; height:32px; }
  .titlebox{ width:min(760px,100%); display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:center; } #title{ align-items:flex-start; padding-top:calc(var(--sat) + 10px); }
  #title.painted .titleart,.titleart{ max-height:calc(100vh - 40px); grid-row:1/6; grid-column:1; } .titlebox>*:not(.titleart){ grid-column:2; } #title h1{ margin-top:0; font-size:2em; }
  .sceneart,.townbg{ max-height:46vh; }
}
#cr-name{ min-height:44px; } .phead .back{ min-width:44px; }
/* thumb reach: on tall portrait phones keep commands and the D-pad low on the screen */
@media (orientation:portrait){ #b-cmd{ display:flex; flex-direction:column; } #b-cmd>:first-child{ margin-top:auto; } }
@media (min-height:800px) and (orientation:portrait){ #controls{ align-items:flex-end; padding-bottom:14px; } }
/* v0.2 map viewer */
.mapview{position:relative;width:100%;height:min(56vh,520px);border:3px double #c8a860;border-radius:6px;background:#05050a;overflow:hidden}
.mapview canvas{width:100%;height:100%;display:block;touch-action:pinch-zoom;cursor:grab}
.maptools{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.maptools .btn{min-width:52px;min-height:48px;font-size:20px}

// ---- 00_core.js ----

const PREFIX='sos_';

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function seeded(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function prefGet(k,d){ try{ const v=localStorage.getItem(PREFIX+k); return v==null?d:v; }catch(e){ return d; } }
function prefSet(k,v){ try{ localStorage.setItem(PREFIX+k,String(v)); }catch(e){} }
function prefDel(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} }
const DIRS=[{x:0,y:-1,n:'N'},{x:1,y:0,n:'E'},{x:0,y:1,n:'S'},{x:-1,y:0,n:'W'}];
const wait=ms=>new Promise(r=>setTimeout(r,window.__fast?0:ms*(prefGet('speed','normal')==='fast'?0.5:1)));

function toast(msg,ms){ const el=$('toast'); if(!el) return; el.innerHTML=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),ms||2600); }

// ---- modals (small dialogs) ----
const MODALS=[];
function modal(html,cls){ const root=$('modal-root'); const w=document.createElement('div'); w.className='modal-wrap';
  w.innerHTML=`<div class="modal win ${cls||''}">${html}</div>`; root.appendChild(w); MODALS.push(w); return w; }
function closeModal(w){ if(!w) w=MODALS[MODALS.length-1]; if(!w) return; const i=MODALS.indexOf(w); if(i>=0) MODALS.splice(i,1); w.remove(); }
function closeAllModals(){ while(MODALS.length) closeModal(); }
// ask: returns a promise with the chosen value. opts: [{label, value, cls, dis}]
function ask(html,opts,cls){ return new Promise(res=>{ const m=modal(`${html}<div class="row col">${opts.map((o,i)=>`<button class="btn ${o.cls||''}" data-i="${i}" ${o.dis?'disabled':''}>${o.label}</button>`).join('')}</div>`,cls);
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ sfx('ok'); closeModal(m); res(opts[+b.dataset.i].value); }); }); }
function say(html,btn){ return ask(html,[{label:btn||'OK',value:true,cls:'primary'}]); }
// story text with speaker portrait
function talk(who,lines,opts){ return new Promise(async res=>{ let i=0; const L=Array.isArray(lines)?lines:[lines];
  for(i=0;i<L.length;i++){ const last=i===L.length-1;
    const o=last&&opts?opts:[{label:last?'OK':'Next ▸',value:true,cls:'primary'}];
    const v=await ask(`<div class="talk">${who?`<div class="tport">${portraitHtml(who)}</div>`:''}<div class="ttext">${who?`<b class="tname">${escapeHtml(speakerName(who))}</b><br>`:''}${L[i]}</div></div>`,o,'talkm');
    if(last){ res(v); return; } } }); }

// ---- panels (full screen menus with a pinned back button) ----
const PANELS=[];
function panel(title,bodyHtml,opt){ opt=opt||{}; const root=$('panel-root'); const p=document.createElement('div'); p.className='panelscr';
  p.innerHTML=`<div class="phead"><button class="btn back" data-back>◀ ${opt.backLabel||'Back'}</button><div class="ptitle">${title}</div>${opt.toMap!==false?'<button class="btn back tomap" data-map>✕ Close all</button>':''}</div><div class="pbody">${bodyHtml}</div>`;
  root.appendChild(p); PANELS.push(p);
  p.querySelector('[data-back]').onclick=()=>{ sfx('back'); closePanel(p); if(opt.onBack) opt.onBack(); };
  const mb=p.querySelector('[data-map]'); if(mb) mb.onclick=()=>{ sfx('back'); closeAllPanels(); if(opt.onBack) opt.onBack(); };
  p.refresh=(t,b)=>{ if(t!=null) p.querySelector('.ptitle').innerHTML=t; const body=p.querySelector('.pbody'); const st=body.scrollTop; body.innerHTML=b; body.scrollTop=st; };
  p.body=()=>p.querySelector('.pbody');
  return p; }
function closePanel(p){ if(!p) p=PANELS[PANELS.length-1]; if(!p) return; const i=PANELS.indexOf(p); if(i>=0) PANELS.splice(i,1); p.remove(); if(typeof onPanelsChanged==='function') onPanelsChanged(); }
function closeAllPanels(){ while(PANELS.length) closePanel(); }

function log(msg){ if(!G) return; G.log=G.log||[]; G.log.unshift(msg); if(G.log.length>60) G.log.length=60; setMsg(msg); }
function setMsg(msg){ const el=$('msg'); if(el) el.innerHTML=msg; }
function fmt(n){ return Math.round(n).toLocaleString(); }

// base stats are generated from level; m = multipliers; wk/rs = element multipliers
function mkEnemy(id,o){ const L=o.lv; const m=o.m||{};
  const e={id,name:o.name,lv:L,art:o.art,pal:o.pal,
    hp:Math.round((20+L*16)*(m.hp||1)), atk:Math.round((7+L*3.3)*(m.atk||1)), def:Math.round((2+L*1.5)*(m.def||1)),
    mag:Math.round((4+L*2.4)*(m.mag||1)), res:Math.round((2+L*1.4)*(m.res||1)), spd:Math.round((5+L*0.9)*(m.spd||1)),
    xp:Math.round((4+L*4+L*L*1.3)*(m.xp||1)), gold:Math.round((4+L*3)*(m.gold||1)),
    el:o.el||{}, acts:o.acts||[['attack',1]], drop:o.drop||null, steal:o.steal||'tonic', imm:o.imm||[], boss:!!o.boss, size:o.size||1, desc:o.desc||''};
  if(o.hpAbs) e.hp=o.hpAbs; return e; }
const ENEMIES={};
function E(id,o){ ENEMIES[id]=mkEnemy(id,o); }

function valueNoise(seed,scale){ const R=seeded(seed); const G2={}; const gv=(i,j)=>{ const k=i+','+j; if(G2[k]==null) G2[k]=R(); return G2[k]; }; const sm=t=>t*t*(3-2*t);
  return (x,y)=>{ const fx=x/scale, fy=y/scale, i=Math.floor(fx), j=Math.floor(fy), u=sm(fx-i), v=sm(fy-j); const a=gv(i,j),b=gv(i+1,j),c=gv(i,j+1),d=gv(i+1,j+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }; }
function genWorld(){ const R=seeded(424242); const m=[]; for(let y=0;y<WH;y++) m.push(new Array(WW).fill('~'));
  const set=(x,y,c)=>{ if(x>=0&&y>=0&&x<WW&&y<WH) m[y][x]=c; }; const get=(x,y)=>(x>=0&&y>=0&&x<WW&&y<WH)?m[y][x]:'~';
  const ell=(cx,cy,rx,ry,c,onlyLand)=>{ for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++) for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){ const d=((x-cx)/rx)**2+((y-cy)/ry)**2; if(d<=1&&(!onlyLand||get(x,y)!=='~')) set(x,y,c); } };
  const n1=valueNoise(7,9), n2=valueNoise(19,4), n3=valueNoise(33,6);
  // 1) the continent's coastline
  for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){ const dx=(x-72)/73, dy=(y-56)/57; const d=Math.sqrt(dx*dx+dy*dy)+(n1(x,y)-0.5)*0.32+(n2(x,y)-0.5)*0.1; if(d<1.0&&x>2&&y>2&&x<WW-3&&y<WH-3) m[y][x]='.'; }
  // 2) biomes: desert north, mountain wall, fields west of the river, coast east
  for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){ if(m[y][x]==='~') continue; const r=R(), n=n3(x,y);
    if(y<=43){ m[y][x]=n>0.72?'h':(r<0.05?'c':'d'); }
    else if(y<=51){ m[y][x]='^'; }
    else { let c='.'; if(n>0.66) c='f'; else if(n<0.2) c='h'; else if(r<0.06) c='f'; else if(r<0.09) c='h';
      if(x<30&&y<=84&&n>0.5) c='f'; if(x<30&&y<=84&&n<0.3) c='h';                    // Greywold: forested highlands
      if(x<66&&y>=90&&n>0.62) c='s';                                                // Southfold marsh edges
      if(x>69&&y>=92) c=n>0.4?'s':(r<0.15?'f':'.');                                 // Fenmarch
      if(x>=118&&y<=92) c=n>0.6?'^':n>0.46?'h':(r<0.25?'d':'a');                     // Cinder Reach: red hills and ash
      m[y][x]=c; } }
  // forest clusters and swamp from the original map (scaled x2)
  for(const [cx,cy,rx,ry] of [[5,25,3,3],[15,23,3,2],[13,35,3,2],[28,26,3,3],[33,22,2,2],[27,35,3,2]]) ell(cx*2+24,cy*2+14,rx*2,ry*2,'f',1);
  ell(108,60,6,6,'s',1); ell(34,56,4.4,3.2,'h',1); ell(44,22,6,4,'h',1);

  ell(64,30,17,9.2,'~'); ell(64,30,5.2,3.4,'i');
  // 4) the river Ferrow runs from the mountains to the southern sea
  for(let y=52;y<WH;y++) for(let x=66;x<=69;x++) set(x,y,'~');
  // 5) the mountain wall reaches both coasts (no way round the Sandgate)
  for(let x=0;x<WW;x++) for(let y=44;y<=51;y++) if(get(x,y)!=='~') set(x,y,'^');
  for(let x=0;x<WW;x++) for(const y of [41,42,43,52,53,54]){ const edge=(y<44?44-y:y-51); if(get(x,y)!=='~'&&n3(x*1.7,y*1.7)>0.42+edge*0.12) set(x,y,'^'); }
  // 5b) features that landed in the sea or on a mountain slide to the nearest walkable land joined to Corlan
  { const ok=(x,y)=>{ const t=get(x,y); return t!=='~'&&t!=='^'; }; const R0=new Set(); const q=[[42,76]]; R0.add('42,76');
    while(q.length){ const [x,y]=q.shift(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy,k=nx+','+ny; if(R0.has(k)) continue; const t=get(nx,ny); if(t==='~'&&!(nx>=66&&nx<=69&&ny===72)) continue; if(t==='^'&&!(nx===96)) continue; R0.add(k); q.push([nx,ny]); } }

// ---------------- procedural 16-bit art ----------------
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function shade(hex,f){ let c=hex.replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join(''); let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  if(f>1){ r=r+(255-r)*(f-1); g=g+(255-g)*(f-1); b=b+(255-b)*(f-1); } else { r*=f; g*=f; b*=f; }
  return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join(''); }
// crisp pixels + dark outline: the "16-bit sprite" look
function pixelize(cv,outline){ const x=cv.getContext('2d'); const W=cv.width,H=cv.height; const im=x.getImageData(0,0,W,H), d=im.data;
  for(let i=0;i<d.length;i+=4) d[i+3]=d[i+3]>110?255:0;
  if(outline){ const o=outline.replace('#',''); const or=parseInt(o.slice(0,2),16),og=parseInt(o.slice(2,4),16),ob=parseInt(o.slice(4,6),16); const src=new Uint8ClampedArray(d);
    for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){ const i=(y*W+xx)*4; if(src[i+3]) continue; let n=false;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const X=xx+dx,Y=y+dy; if(X>=0&&Y>=0&&X<W&&Y<H&&src[(Y*W+X)*4+3]){ n=true; break; } }
      if(n){ d[i]=or; d[i+1]=og; d[i+2]=ob; d[i+3]=255; } } }
  x.putImageData(im,0,0); return cv; }
function P(x){ return {
  c:(cx,cy,r,col)=>{ x.fillStyle=col; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill(); },
  e:(cx,cy,rx,ry,col,rot)=>{ x.fillStyle=col; x.beginPath(); x.ellipse(cx,cy,rx,ry,rot||0,0,Math.PI*2); x.fill(); },
  r:(a,b,w,h,col)=>{ x.fillStyle=col; x.fillRect(a,b,w,h); },
  p:(pts,col)=>{ x.fillStyle=col; x.beginPath(); x.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) x.lineTo(pts[i],pts[i+1]); x.closePath(); x.fill(); },
  l:(a,b,c2,d,col,w)=>{ x.strokeStyle=col; x.lineWidth=w||1; x.beginPath(); x.moveTo(a,b); x.lineTo(c2,d); x.stroke(); } }; }

// ---- portraits ----
const PORT={};
function lookFor(who){ if(who==='hero') return G&&G.hero?G.hero.look:null; if(COMPANIONS[who]) return COMPANIONS[who].look; if(NPCS[who]) return NPCS[who].look; const c=G&&G.party&&G.chars&&G.chars[who]; return c?c.look:null; }
function speakerName(who){ if(who==='hero') return G.hero.name; if(COMPANIONS[who]) return COMPANIONS[who].name; if(NPCS[who]) return NPCS[who].name; return who; }
function portraitProc(who,size){ const look=lookFor(who)||{skin:'#d8a878',hair:'#553',eye:'#333',coat:'#666'}; const key=who+JSON.stringify(look); if(PORT[key]) return PORT[key];
  const S=32, bg=mkCanvas(S,S), b=bg.getContext('2d'); const g=b.createLinearGradient(0,0,0,S); g.addColorStop(0,shade(look.coat,0.55)); g.addColorStop(1,'#0a0810'); b.fillStyle=g; b.fillRect(0,0,S,S);
  const fg=mkCanvas(S,S), x=fg.getContext('2d'), p=P(x); const sk=look.skin, hr=look.hair, ct=look.coat;

// ---------------- characters, stats, leveling, equipment ----------------
const MAX_PARTY=4, BENCH_XP=0.5, PTS_PER_LV=2;
function xpNeed(lv){ return Math.round(14*Math.pow(lv,2.1)+20*lv); }
function newChar(id,o){ const C=CLASSES[o.cls]; const c={id,name:o.name,cls:o.cls,lv:1,xp:0,alloc:{str:0,int:0,agi:0,vit:0,spi:0},bonus:o.bonus||{},pts:0,path:null,disc:null,
   eq:{weapon:null,armor:null,shield:null,acc:null},row:o.row||'front',look:o.look,hp:1,mp:1,respecs:0};
  for(const s in (o.gear||{})) c.eq[s]=o.gear[s];
  const L=o.lv||1; for(let i=1;i<L;i++){ c.lv++; c.pts+=PTS_PER_LV; }
  c.hp=maxHP(c); c.mp=maxMP(c); return c; }
function cls(c){ return CLASSES[c.cls]; }
function pathOf(c){ return c.path?cls(c).paths[c.path]:null; }
function eqItems(c){ return ['weapon','armor','shield','acc'].map(s=>c.eq[s]&&ITEMS[c.eq[s]]).filter(Boolean); }
function stat(c,s){ const C=cls(c); let v=C.base[s]+C.gr[s]*(c.lv-1)+(c.alloc[s]||0)+(c.bonus[s]||0); const pa=pathOf(c); if(pa&&pa.gr[s]) v+=pa.gr[s]*Math.max(0,c.lv-PATH_LV+1);
  for(const it of eqItems(c)) if(it[s]) v+=it[s]; return Math.max(1,Math.floor(v)); }
function discMod(c,k){ const d=c.disc&&DISCIPLINES[c.disc]; return d&&d.mods[k]!=null?d.mods[k]:(k==='spd'?0:1); }
function maxHP(c){ const C=cls(c), pa=pathOf(c); const hpL=C.hpL+((pa&&pa.hpL&&c.lv>=PATH_LV)?pa.hpL:0); return Math.max(1,Math.round((C.hp0+hpL*(c.lv-1)+stat(c,'vit')*1.6)*discMod(c,'hp'))); }
function maxMP(c){ const C=cls(c); let v=C.mp0+C.mpL*(c.lv-1)+(stat(c,'int')+stat(c,'spi'))*0.45; for(const it of eqItems(c)) if(it.mp) v+=it.mp; return Math.max(0,Math.round(v*discMod(c,'mp'))); }
function weight(c){ let w=0; for(const it of eqItems(c)) w+=it.wt||0; return w; }
function cAtk(c){ const w=c.eq.weapon&&ITEMS[c.eq.weapon]; return Math.round(((w?w.atk:2)+stat(c,'str'))*discMod(c,'atk')); }
function cMag(c){ const w=c.eq.weapon&&ITEMS[c.eq.weapon]; let v=((w&&w.mag)||0)+stat(c,'int'); const a=c.eq.armor&&ITEMS[c.eq.armor]; if(a&&a.cls==='heavy') v*=0.85;
  const acc=c.eq.acc&&ITEMS[c.eq.acc]; if(acc&&acc.magM) v*=acc.magM; return Math.round(v*discMod(c,'mag')); }
function cDef(c){ let v=stat(c,'vit')*0.5; for(const it of eqItems(c)) if(it.def&&it.s!=='acc') v+=it.def; const acc=c.eq.acc&&ITEMS[c.eq.acc]; if(acc&&acc.def) v+=acc.def; if(acc&&acc.defM) v*=acc.defM; return Math.round(v*discMod(c,'def')); }
function cRes(c){ let v=stat(c,'spi')*0.6; for(const it of eqItems(c)) if(it.res) v+=it.res; return Math.round(v); }
function cSpd(c){ let v=stat(c,'agi')-weight(c)+discMod(c,'spd'); for(const it of eqItems(c)) if(it.spd&&it.s!=='acc') v+=it.spd; const acc=c.eq.acc&&ITEMS[c.eq.acc]; if(acc&&acc.spd) v+=acc.spd; return Math.max(1,Math.round(v)); }
function cCrit(c){ let v=0.04+stat(c,'agi')*0.003; for(const it of eqItems(c)) if(it.crit) v+=it.crit; return v; }
function cElRes(c,el){ let m=1; for(const it of eqItems(c)) if(it.rs&&it.rs[el]!=null) m*=it.rs[el]; return m; }
function cImm(c,st){ return eqItems(c).some(it=>it.imm&&it.imm.includes(st)); }
function cRanged(c){ const w=c.eq.weapon&&ITEMS[c.eq.weapon]; return !!(w&&w.ranged); }
function abilities(c){ const C=cls(c); const out=C.abil.filter(([l])=>c.lv>=l).map(a=>a[1]); const pa=pathOf(c); if(pa) for(const [l,a] of pa.abil) if(c.lv>=l) out.push(a);
  if(c.disc) out.push(DISCIPLINES[c.disc].abil); return out; }
function nextAbilities(c){ const C=cls(c); const out=[]; for(const [l,a] of C.abil) if(c.lv<l) out.push([l,a]); const pa=pathOf(c); if(pa) for(const [l,a] of pa.abil) if(c.lv<l) out.push([l,a]); return out; }
function pendingChoice(c){ if(c.lv>=PATH_LV&&!c.path) return 'path'; if(c.lv>=DISC_LV&&!c.disc) return 'disc'; return null; }
function canEquip(c,id){ const it=ITEMS[id]; if(!it) return false; const C=cls(c); const pa=pathOf(c);
  if(it.s==='weapon') return C.wpn.includes(it.ty);
  if(it.s==='armor') return C.arm.includes(it.cls)||(pa&&pa.arm&&pa.arm.includes(it.cls));
  if(it.s==='shield') return !!C.shield;
  if(it.s==='acc') return true; return false; }
function equipReason(c,id){ const it=ITEMS[id]; const C=cls(c); if(canEquip(c,id)){ if(it.s==='shield'&&c.eq.weapon&&ITEMS[c.eq.weapon].two) return 'Unequips your two-handed weapon'; return ''; }
  if(it.s==='weapon') return C.name+'s cannot use '+it.ty+'s'; if(it.s==='armor') return C.name+'s cannot wear '+it.cls+' armor'+(it.cls==='heavy'&&Object.values(C.paths).some(p=>p.arm)?' (unless they take the '+Object.values(C.paths).find(p=>p.arm).name+' path)':''); if(it.s==='shield') return C.name+'s cannot use shields'; return ''; }
function invAdd(id,n){ G.inv[id]=(G.inv[id]||0)+(n==null?1:n); if(G.inv[id]<=0) delete G.inv[id]; }
function invHas(id){ return (G.inv[id]||0)>0; }
function equip(c,id){ const it=ITEMS[id]; const slot=it.s; if(!canEquip(c,id)) return false;
  if(c.eq[slot]) invAdd(c.eq[slot]); invAdd(id,-1); c.eq[slot]=id;
  if(slot==='weapon'&&it.two&&c.eq.shield){ invAdd(c.eq.shield); c.eq.shield=null; toast('Two-handed: shield removed.'); }
  if(slot==='shield'&&c.eq.weapon&&ITEMS[c.eq.weapon].two){ invAdd(c.eq.weapon); c.eq.weapon=null; toast('Shields need a free hand: two-handed weapon removed.'); }
  clampHPMP(c); return true; }
function unequip(c,slot){ if(!c.eq[slot]) return; invAdd(c.eq[slot]); c.eq[slot]=null; clampHPMP(c); }
function clampHPMP(c){ c.hp=Math.min(c.hp,maxHP(c)); c.mp=Math.min(c.mp,maxMP(c)); }
// after a gear change, what would stats look like?
function previewEquip(c,id){ const clone=JSON.parse(JSON.stringify(c)); const it=ITEMS[id]; clone.eq[it.s]=id; if(it.s==='weapon'&&it.two) clone.eq.shield=null; if(it.s==='shield'&&clone.eq.weapon&&ITEMS[clone.eq.weapon].two) clone.eq.weapon=null;
  return {atk:cAtk(clone)-cAtk(c),mag:cMag(clone)-cMag(c),def:cDef(clone)-cDef(c),res:cRes(clone)-cRes(c),spd:cSpd(clone)-cSpd(c),hp:maxHP(clone)-maxHP(c),mp:maxMP(clone)-maxMP(c)}; }
function gainXP(c,amt){ const ups=[]; c.xp+=Math.round(amt); while(c.xp>=xpNeed(c.lv)){ c.xp-=xpNeed(c.lv); const ohp=maxHP(c), omp=maxMP(c); const oldAb=abilities(c); c.lv++; c.pts+=PTS_PER_LV;
    c.hp+=maxHP(c)-ohp; c.mp+=maxMP(c)-omp; const learned=abilities(c).filter(a=>!oldAb.includes(a)); ups.push({lv:c.lv,learned}); } return ups; }
function autoAllocate(c){ const pref={blade:['str','vit','agi'],vanguard:['vit','str'],arcanist:['int','spi','agi'],scout:['agi','str'],acolyte:['spi','vit','int'],machinist:['str','int','agi'],shade:['int','agi','str'],brawler:['str','agi','vit'],starseer:['spi','int','agi']}[c.cls];
  let i=0; while(c.pts>0){ const ohp=maxHP(c), omp=maxMP(c); c.alloc[pref[i%pref.length]]++; c.pts--; i++; c.hp+=maxHP(c)-ohp; c.mp+=maxMP(c)-omp; } }
function partyChars(){ return G.party.map(id=>G.chars[id]); }
function rosterChars(){ return G.roster.map(id=>G.chars[id]); }
function benchChars(){ return G.roster.filter(id=>!G.party.includes(id)).map(id=>G.chars[id]); }
function restParty(all){ for(const c of (all?rosterChars():partyChars())){ c.hp=maxHP(c); c.mp=maxMP(c); } }
function recruit(id){ const D=COMPANIONS[id]; if(G.chars[id]) return; const avg=Math.round(partyChars().reduce((a,c)=>a+c.lv,0)/Math.max(1,G.party.length));
  const c=newChar(id,{name:D.name,cls:D.cls,look:D.look,gear:D.gear,lv:Math.max(D.lv,avg-1),row:D.row}); G.chars[id]=c; G.roster.push(id);
  if(G.party.length<MAX_PARTY){ G.party.push(id); toast(`<b>${D.name}</b> joined the party!`); } else toast(`<b>${D.name}</b> joined. The party is full, so they wait on the bench (swap at an inn or camp).`);
  sfx('fanfare'); refreshHUD(); }

// ---------------- main view: overworld + first-person dungeons ----------------
const VW=256, VH=224;
const VIEW={cv:null,x:null,anim:0,flash:0,last:0,zoom:1};
function viewInit(){ VIEW.cv=$('cv'); VIEW.cv.width=VW; VIEW.cv.height=VH; VIEW.x=VIEW.cv.getContext('2d'); VIEW.x.imageSmoothingEnabled=false; VIEW.zoom=parseFloat(prefGet('wzoom','1'))||1; requestAnimationFrame(viewLoop); }
function viewLoop_v01(t){ requestAnimationFrame(viewLoop); if(!G||G.mode==='title') return; if(document.hidden) return; if(t-VIEW.last<90&&!VIEW.dirty) return; VIEW.last=t; VIEW.dirty=false; VIEW.anim=Math.floor(t/550)%2; drawView(); }
function drawView_v01(){ if(!G||!G.pos) return; const x=VIEW.x; x.imageSmoothingEnabled=false; if(G.mode==='dungeon') drawDungeon(x); else drawWorld(x); if(VIEW.flash>0){ x.fillStyle=`rgba(255,255,255,${VIEW.flash})`; x.fillRect(0,0,VW,VH); VIEW.flash=Math.max(0,VIEW.flash-0.15); VIEW.dirty=true; } }
function redraw(){ VIEW.dirty=true; }

// ---- overworld ----
function drawWorld_v01(x){ const z=VIEW.zoom, ts=16*z; const px=G.pos.x, py=G.pos.y; const cols=Math.ceil(VW/ts)+2, rows=Math.ceil(VH/ts)+2;
  const ox=VW/2-ts/2-px*ts, oy=VH/2-ts/2-py*ts; x.fillStyle='#1a3a88'; x.fillRect(0,0,VW,VH);
  const x0=Math.floor(px-cols/2), y0=Math.floor(py-rows/2);
  for(let ty=y0;ty<y0+rows;ty++) for(let tx=x0;tx<x0+cols;tx++){ const t=wTile(tx,ty); const sx=Math.round(ox+tx*ts), sy=Math.round(oy+ty*ts), sz=Math.ceil(ts);
    let base=t; if(t==='T'||t==='D') base=(wZone(tx,ty)==='desert'?'d':'.'); if(t==='D'&&tx===19&&ty===8) base='i';
    x.drawImage(tileArt(base, base==='~'?VIEW.anim:0),sx,sy,sz,sz);
    if(t==='T'||t==='D'){ const f=wFeat(tx,ty); if(f) x.drawImage(featArt(f),sx,sy,sz,sz); }
    if(t==='b'&&!G.flags.mine_done){ x.fillStyle='#8a2a1a'; x.fillRect(sx+sz*0.1,sy+sz*0.35,sz*0.8,sz*0.12); x.fillRect(sx+sz*0.1,sy+sz*0.58,sz*0.8,sz*0.12); }
    if(t==='G'&&G.flags.archive_done){ x.fillStyle='rgba(200,168,112,0.9)'; x.fillRect(sx+sz*0.3,sy,sz*0.4,sz); } }
  // goal marker
  const gl=goalTarget(); if(gl&&gl.world){ const gx=ox+gl.x*ts+ts/2, gy=oy+gl.y*ts+ts/2;
    if(gx>4&&gx<VW-4&&gy>4&&gy<VH-4){ if(VIEW.anim){ x.strokeStyle='#f8e070'; x.lineWidth=2; x.strokeRect(gx-ts/2,gy-ts/2,ts,ts); } }
    else { const a=Math.atan2(gy-VH/2,gx-VW/2); const r=Math.min(VW,VH)/2-12; const ax=VW/2+Math.cos(a)*r*1.05, ay=VH/2+Math.sin(a)*r; drawArrow(x,clamp(ax,10,VW-10),clamp(ay,10,VH-10),a); } }
  const lead=G.chars[G.party[0]]||G.chars.hero; const spr=leaderSprite(lead.cls,G.walkF||0); x.drawImage(spr,Math.round(VW/2-ts/2),Math.round(VH/2-ts/2),Math.ceil(ts),Math.ceil(ts));
  if(G.flags.skiff_ride){ /* reserved */ }
}
function drawArrow(x,ax,ay,a){ x.save(); x.translate(ax,ay); x.rotate(a); x.fillStyle='#f8e070'; x.strokeStyle='#000'; x.lineWidth=1.5; x.beginPath(); x.moveTo(9,0); x.lineTo(-6,-7); x.lineTo(-2,0); x.lineTo(-6,7); x.closePath(); x.fill(); x.stroke(); x.restore(); }

// ---- first-person dungeon ----
function curFloor(){ return buildFloor(G.dpos.did,G.dpos.fi); }
function edgeRect(i){ const hs=i<0?200:128/(1+i*0.85); const vs=hs*0.86; return {x0:128-hs,x1:128+hs,y0:108-vs,y1:108+vs,hs}; }
function drawDungeon_v01(x){ const fl=curFloor(); const th=DUNGEONS[fl.did].theme; const D=DIRS[G.dpos.f], L=DIRS[(G.dpos.f+3)%4], Rr=DIRS[(G.dpos.f+1)%4];
  const st=dState(fl.did,fl.fi); const px=G.dpos.x, py=G.dpos.y; const MAXD=5;
  // ceiling & floor

  g=x.createLinearGradient(0,108,0,VH); g.addColorStop(0,'#000'); g.addColorStop(1,shade(th.floor,1.25)); x.fillStyle=g; x.fillRect(0,108,VW,VH-108);
  x.lineWidth=1; for(let i=0;i<=MAXD;i++){ const r=edgeRect(i); const f=clamp(1-i*0.15,0.2,1); x.strokeStyle=shade(th.floor,0.55+0.5*f); x.beginPath(); x.moveTo(r.x0,r.y1); x.lineTo(r.x1,r.y1); x.stroke(); x.strokeStyle=shade(th.ceil,1+0.8*f); x.beginPath(); x.moveTo(r.x0,r.y0); x.lineTo(r.x1,r.y0); x.stroke(); }
  x.strokeStyle=shade(th.floor,0.7);
  for(const s of [-1,1]){ x.beginPath(); x.moveTo(128+s*128,VH); x.lineTo(128+s*edgeRect(MAXD).hs,edgeRect(MAXD).y1); x.stroke(); }
  const cellAt=k=>({x:px+D.x*k,y:py+D.y*k});
  let frontK=MAXD+1; for(let k=1;k<=MAXD;k++){ const c=cellAt(k); if(dSolid(dCell(fl,c.x,c.y))){ frontK=k; break; } }
  for(let k=Math.min(frontK,MAXD);k>=1;k--){ const c=cellAt(k); const fog=clamp(1-(k-1)*0.16,0.25,1);
    const near=edgeRect(k-1), far=edgeRect(k);
    if(k===frontK){ drawFace(x,near.x0,near.y0,near.x1,near.y1,dCell(fl,c.x,c.y),th,fog); }
    else {
      for(const [S,side] of [[L,-1],[Rr,1]]){ const sc={x:c.x+S.x,y:c.y+S.y}; const t=dCell(fl,sc.x,sc.y);
        if(dSolid(t)) drawSide(x,near,far,side,t,th,fog);
        else { const bc={x:sc.x+D.x,y:sc.y+D.y}; const bt=dCell(fl,bc.x,bc.y); const w=far.x1-far.x0;
          if(dSolid(bt)){ if(side<0) drawFace(x,far.x0-w,far.y0,far.x0,far.y1,bt,th,fog*0.85); else drawFace(x,far.x1,far.y0,far.x1+w,far.y1,bt,th,fog*0.85); } } }

  seenSet(st,fl,px+L.x,py+L.y); seenSet(st,fl,px+Rr.x,py+Rr.y);
  // here-cell hint
  const here=dCell(fl,px,py); if(here==='R'||here==='S'||here==='U'||here==='E'||here==='X'){ x.fillStyle='rgba(0,0,0,0.55)'; x.fillRect(0,VH-18,VW,18); x.fillStyle='#f8e070'; x.font='10px monospace'; x.textAlign='center';
    x.fillText({R:'A healing spring — tap ✋ Act',S:'Stairs down — tap ✋ Act',U:'Stairs up — tap ✋ Act',E:'The way out — tap ✋ Act',X:'A light to the surface — tap ✋ Act'}[here],128,VH-6); }
  if(prefGet('minimap','on')==='on') drawMini(x,fl,st);
  // compass
  x.fillStyle='rgba(0,0,0,0.6)'; x.fillRect(4,4,22,16); x.fillStyle='#f8e070'; x.font='bold 11px monospace'; x.textAlign='center'; x.fillText(D.n,15,16);
}
function bricks(x,pts,th,fog,isFace){ /* pts: near-top, far-top, far-bottom, near-bottom */ }
function drawFace(x,x0,y0,x1,y1,t,th,fog){ const w=x1-x0,h=y1-y0; x.fillStyle=shade(th.wall,fog); x.fillRect(x0,y0,w,h);
  x.strokeStyle=shade(th.mortar,fog*0.9); x.lineWidth=Math.max(1,w/90); const rows=6; for(let r=1;r<rows;r++){ const yy=y0+h*r/rows; x.beginPath(); x.moveTo(x0,yy); x.lineTo(x1,yy); x.stroke(); }
  for(let r=0;r<rows;r++){ const off=(r%2)*0.5; for(let c=0;c<3;c++){ const xx=x0+w*((c+off)/3); if(xx<=x0+1) continue; x.beginPath(); x.moveTo(xx,y0+h*r/rows); x.lineTo(xx,y0+h*(r+1)/rows); x.stroke(); } }
  x.fillStyle=shade(th.wall,fog*1.25); x.fillRect(x0,y0,w,Math.max(1,h*0.02));
  if(t==='D'||t==='L'){ const dx0=x0+w*0.25, dx1=x0+w*0.75, dy0=y0+h*0.18; x.fillStyle=shade('#3a2210',fog); x.fillRect(dx0-w*0.03,dy0-h*0.03,dx1-dx0+w*0.06,y1-dy0+h*0.03); x.fillStyle=shade('#7a4a22',fog); x.fillRect(dx0,dy0,dx1-dx0,y1-dy0);
    x.fillStyle=shade('#5a3418',fog); for(let i=1;i<4;i++) x.fillRect(dx0+(dx1-dx0)*i/4,dy0,Math.max(1,w/120),y1-dy0); x.fillStyle=shade('#c8a040',fog); x.fillRect(dx0+(dx1-dx0)*0.78,dy0+(y1-dy0)*0.5,w*0.03,w*0.03);
    if(t==='L'){ const cx=(dx0+dx1)/2, cy=dy0+(y1-dy0)*0.45, s=w*0.06; x.fillStyle=shade('#e8c040',fog); x.fillRect(cx-s,cy,s*2,s*1.6); x.strokeStyle=shade('#e8c040',fog); x.lineWidth=Math.max(1,s*0.4); x.beginPath(); x.arc(cx,cy,s*0.7,Math.PI,0); x.stroke(); } } }
function drawSide(x,near,far,side,t,th,fog){ const xn=side<0?near.x0:near.x1, xf=side<0?far.x0:far.x1; x.fillStyle=shade(th.wall2,fog); x.beginPath(); x.moveTo(xn,near.y0); x.lineTo(xf,far.y0); x.lineTo(xf,far.y1); x.lineTo(xn,near.y1); x.closePath(); x.fill();
  x.strokeStyle=shade(th.mortar,fog*0.75); x.lineWidth=1; const rows=6; for(let r=1;r<rows;r++){ const yn=near.y0+(near.y1-near.y0)*r/rows, yf=far.y0+(far.y1-far.y0)*r/rows; x.beginPath(); x.moveTo(xn,yn); x.lineTo(xf,yf); x.stroke(); }
  for(let r=0;r<rows;r++){ for(const tt of (r%2?[0.5]:[0.28,0.72])){ const xx=xn+(xf-xn)*tt; const yt=near.y0+(far.y0-near.y0)*tt, yb=near.y1+(far.y1-near.y1)*tt; const h=yb-yt; x.beginPath(); x.moveTo(xx,yt+h*r/rows); x.lineTo(xx,yt+h*(r+1)/rows); x.stroke(); } }
  if(t==='D'||t==='L'){ const a=0.3,b=0.75; const X=tt=>xn+(xf-xn)*tt, YT=tt=>near.y0+(far.y0-near.y0)*tt, YB=tt=>near.y1+(far.y1-near.y1)*tt;
    x.fillStyle=shade(t==='L'?'#6a3a1a':'#7a4a22',fog); x.beginPath(); x.moveTo(X(a),YT(a)+(YB(a)-YT(a))*0.2); x.lineTo(X(b),YT(b)+(YB(b)-YT(b))*0.2); x.lineTo(X(b),YB(b)); x.lineTo(X(a),YB(a)); x.closePath(); x.fill(); } }
function drawObj(x,fl,c,k,fog){ const t=dCell(fl,c.x,c.y); const st=dState(fl.did,fl.fi); const midI=k-0.5; const r=edgeRect(midI); const s=r.hs; const yb=r.y1; const cx=128;
  const dim=(col)=>shade(col,fog);
  if(t>='a'&&t<='z'){ const w=s*0.5,h=s*0.32; x.fillStyle=dim('#7a4a1a'); x.fillRect(cx-w/2,yb-h,w,h); x.fillStyle=dim('#a86a2a'); x.fillRect(cx-w/2,yb-h,w,h*0.35); x.fillStyle=dim('#e8c040'); x.fillRect(cx-w*0.06,yb-h*0.75,w*0.12,h*0.25); x.fillRect(cx-w/2,yb-h*0.62,w,Math.max(1,h*0.06)); }
  else if(t==='o'){ const w=s*0.5,h=s*0.22; x.fillStyle=dim('#5a3a1a'); x.fillRect(cx-w/2,yb-h,w,h); x.fillStyle=dim('#2a1a0a'); x.fillRect(cx-w/2+2,yb-h,w-4,h*0.3); }
  else if(t==='S'){ x.fillStyle='#000'; x.beginPath(); x.ellipse(cx,yb-s*0.06,s*0.55,s*0.14,0,0,Math.PI*2); x.fill(); x.fillStyle=dim('#888'); for(let i=0;i<3;i++) x.fillRect(cx-s*0.3+i*s*0.05,yb-s*0.1+i*s*0.04,s*0.5-i*s*0.1,Math.max(1,s*0.02)); }
  else if(t==='U'){ x.fillStyle=dim('#8a8a8a'); for(let i=0;i<5;i++) x.fillRect(cx-s*0.35+i*s*0.04,yb-s*0.1-i*s*0.16,s*0.7-i*s*0.08,s*0.08); }
  else if(t==='E'||t==='X'){ const gg=x.createRadialGradient(cx,yb-s*0.5,2,cx,yb-s*0.5,s*0.7); gg.addColorStop(0,'rgba(255,250,200,0.95)'); gg.addColorStop(1,'rgba(255,250,200,0)'); x.fillStyle=gg; x.fillRect(cx-s,yb-s*1.3,s*2,s*1.3); }
  else if(t==='R'){ x.fillStyle=dim('#2a6ad8'); x.beginPath(); x.ellipse(cx,yb-s*0.05,s*0.5,s*0.12,0,0,Math.PI*2); x.fill(); x.fillStyle=dim('#8ad8ff'); x.beginPath(); x.ellipse(cx,yb-s*0.07,s*0.3,s*0.06,0,0,Math.PI*2); x.fill(); if(VIEW.anim){ x.fillStyle='rgba(200,240,255,0.7)'; x.fillRect(cx-1,yb-s*0.45,2,s*0.3); } }
  else if(t==='T'){ const seen=st.trap[c.x+','+c.y]||hasScout(); if(seen){ x.fillStyle=dim('#5a5a5a'); x.fillRect(cx-s*0.35,yb-s*0.06,s*0.7,s*0.06); x.fillStyle=dim('#c8c8c8'); for(let i=0;i<5;i++){ const bx=cx-s*0.3+i*s*0.15; x.beginPath(); x.moveTo(bx,yb-s*0.06); x.lineTo(bx+s*0.04,yb-s*0.2); x.lineTo(bx+s*0.08,yb-s*0.06); x.fill(); } } }
  else if(t==='B'||(t>='1'&&t<='9')){ const id=t==='B'?fl.spec.boss:fl.fixed[t][0]; const spr=enemySpriteProc(id); const sz=s*(t==='B'?1.5:1.05); x.globalAlpha=fog; x.drawImage(spr,cx-sz/2,yb-sz,sz,sz); x.globalAlpha=1; }
  else if(t==='N'){ const p=portraitProc(fl.spec.npc); const sz=s*0.7; x.fillStyle='rgba(140,200,255,0.35)'; x.fillRect(cx-sz*0.6,yb-sz*1.4,sz*1.2,sz*1.4); x.globalAlpha=fog; x.drawImage(p,cx-sz/2,yb-sz*1.25,sz,sz); x.globalAlpha=1; } }
function drawMini(x,fl,st){ const R=4, cs=6, S=(R*2+1)*cs, ox=VW-S-4, oy=4; x.fillStyle='rgba(0,0,0,0.65)'; x.fillRect(ox-2,oy-2,S+4,S+4);
  for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){ const cx=G.dpos.x+dx, cy=G.dpos.y+dy; if(cx<0||cy<0||cx>=fl.W||cy>=fl.H) continue; if(!seenGet(st,fl,cx,cy)) continue; const t=dCell(fl,cx,cy);
    x.fillStyle=miniColor(t,st,cx,cy); x.fillRect(ox+(dx+R)*cs,oy+(dy+R)*cs,cs-1,cs-1); }
  drawPlayerArrow(x,ox+R*cs+cs/2-0.5,oy+R*cs+cs/2-0.5,cs*0.5); }
function miniColor(t,st,x,y){ if(t==='#') return '#5a5a6a'; if(t==='D'||t==='L') return t==='L'?'#e8a040':'#a86a2a'; if(t>='a'&&t<='z') return '#f8e070'; if(t==='S'||t==='U'||t==='E'||t==='X') return '#6af'; if(t==='R') return '#3ad8f8'; if(t==='B') return '#f33'; if(t>='1'&&t<='9') return '#f86'; if(t==='N') return '#f8f'; if(t==='T'&&(st.trap[x+','+y]||hasScout())) return '#c33'; return '#1a1a24'; }
function drawPlayerArrow(x,cx,cy,r){ const a=[-Math.PI/2,0,Math.PI/2,Math.PI][G.dpos.f]; x.save(); x.translate(cx,cy); x.rotate(a); x.fillStyle='#fff'; x.beginPath(); x.moveTo(r*1.3,0); x.lineTo(-r,-r); x.lineTo(-r*0.4,0); x.lineTo(-r,r); x.closePath(); x.fill(); x.restore(); }

function openAutomap_v01(){ if(G.mode!=='dungeon'){ openWorldMap(); return; } const fl=curFloor(); const st=dState(fl.did,fl.fi); const cs=Math.floor(Math.min(380/fl.W,380/fl.H)); const cv=mkCanvas(fl.W*cs,fl.H*cs); const x=cv.getContext('2d');

// ---- movement ----
function tryMove(dir){ if(!G||B||PANELS.length||MODALS.length||G.busy) return; if(G.mode==='world') worldStep(dir); else if(G.mode==='dungeon') dungeonInput(dir); }
async function worldStep_v01(di){ const d=DIRS[di]; VIEW.face=di; redraw(); const nx=G.pos.x+d.x, ny=G.pos.y+d.y; const why={}; if(!wPassable(nx,ny,why)){ if(why.msg){ setMsg(why.msg); sfx('bump'); } else sfx('bump'); return; }
  camStart('walk',150,{walk:1}); G.pos.x=nx; G.pos.y=ny; G.walkF=(G.walkF+1)%2; G.steps++; sfx('step'); redraw();
  const t=wTile(nx,ny); const f=wFeat(nx,ny);
  if(f){ G.busy=true; try{ await camWait(); await worldFeature(f); } finally{ G.busy=false; } return; }
  encounterTick(ENC_RATE[t]||1, ()=>ZONE_ENC[wZone(nx,ny)], wZone(nx,ny)); }
function encounterTick_v01(rate,tableFn,bg){ if(!rate) return; const mult={low:1.8,normal:1,high:0.7}[prefGet('enc','normal')]||1; G.encSteps-=rate; if(G.encSteps<=0){ G.encSteps=rint(13,24)*mult; const grp=pick(tableFn()); startBattle(grp,{bg}); } }
async function worldFeature_v01(f){ if(f.type==='town'){ enterTown(f.id); return; }
  if(f.type==='dungeon'){ const D=DUNGEONS[f.id]; if(f.id==='citadel'&&!G.flags.spire_done){ await say('The Citadel gate is sealed by starlight.'); return; }
    const v=await ask(`<h3>${D.name}</h3><p>${dungeonBlurb(f.id)}</p>`,[{label:'Enter',value:1,cls:'primary'},{label:'Not yet',value:0}]); if(v) enterDungeon(f.id,0); return; }
  if(f.type==='dock'){ if(f.id==='dock_main'){ if(!G.flags.skiff){ await say('An empty pier. A sign reads: <i>Sky-skiff rides to the Citadel isle, by order of the Qadir Emir only.</i>'); return; }
      const v=await ask('<p>Take the sky-skiff across the inland sea to the Citadel isle?</p>',[{label:'Sail',value:1,cls:'primary'},{label:'Stay',value:0}]); if(v){ VIEW.flash=0.9; G.pos={x:22,y:8}; log('The skiff carries you to the isle.'); sfx('fanfare'); autosave(); } }
    else { const v=await ask('<p>Ride the skiff back to the Qadir shore?</p>',[{label:'Sail',value:1,cls:'primary'},{label:'Stay',value:0}]); if(v){ VIEW.flash=0.9; G.pos={x:29,y:8}; log('Back on the Qadir shore.'); } } redraw(); } }
function dungeonBlurb_v01(id){ return {mine:'An old iron mine. Miners say a burning stone fell into it, and the monsters came after.',archive:'The great library of Vessa, swallowed by the sea a century ago.',spire:'A tower of living glass that grew overnight where a Sun Shard landed.',citadel:'The Archon\'s fortress, built from fallen stars.'}[id]; }
function enterDungeon_v01(did,fi,atStairs){ const fl=buildFloor(did,fi); G.mode='dungeon'; let sx=fl.start.x, sy=fl.start.y;
  if(atStairs){ for(let y=0;y<fl.H;y++) for(let x=0;x<fl.W;x++) if(fl.g[y][x]===atStairs){ sx=x; sy=y; } }
  G.dpos={did,fi,x:sx,y:sy,f:firstOpenDir(fl,sx,sy)}; G.encSteps=Math.max(G.encSteps,8); VIEW.flash=0.6; log(`${DUNGEONS[did].name} — ${fl.name}`); playMusic('dungeon'); refreshHUD(); redraw(); autosave(); tip('dungeon'); }
function firstOpenDir(fl,x,y){ for(let i=0;i<4;i++){ const d=DIRS[i]; if(!dSolid(dCell(fl,x+d.x,y+d.y))&&dCell(fl,x+d.x,y+d.y)!=='#') return i; } return 0; }
function leaveDungeon_v01(){ const D=DUNGEONS[G.dpos.did]; G.mode='world'; G.pos={x:D.x,y:D.y+1}; if(!wPassable(G.pos.x,G.pos.y)) G.pos={x:D.x+1,y:D.y}; if(!wPassable(G.pos.x,G.pos.y)) G.pos={x:D.x,y:D.y-1};
  G.dpos=null; VIEW.flash=0.6; playMusic('world'); refreshHUD(); redraw(); autosave(); log('Back in the open air.'); }
async function dungeonInput(di){ // 0 fwd,1 right,2 turn,3 left
  if(di===1||di===3||di===2){ camStart('turn',di===2?260:170,{turn180:di===2}); G.dpos.f=(G.dpos.f+(di===1?1:di===3?3:2))%4; sfx('turn'); redraw(); return; }
  const fl=curFloor(); const D=DIRS[G.dpos.f]; const nx=G.dpos.x+D.x, ny=G.dpos.y+D.y; const t=dCell(fl,nx,ny); const st=dState(fl.did,fl.fi); const k=nx+','+ny;
  if(t==='#'){ camStart('bump',180); sfx('bump'); setMsg('A solid wall.'); return; }
  if(t==='D'){ st.open[k]=1; sfx('door'); }
  if(t==='L'){ const key=fl.spec.key||DUNGEONS[fl.did].floors.map(f=>f.key).find(Boolean); if(invHas(key)){ st.open[k]=1; sfx('door'); log(`Unlocked with the ${ITEMS[key].n}.`); } else { camStart('bump',180); sfx('bump'); setMsg('🔒 Locked. A key must be hidden somewhere on this floor.'); return; } }
  camStart('step',190,{walk:1}); G.dpos.x=nx; G.dpos.y=ny; G.steps++; sfx('step'); redraw(); G.busy=true; try{ await camWait(); await dungeonCell(fl,nx,ny); } finally{ G.busy=false; } }
async function dungeonCell(fl,x,y){ const t=dCell(fl,x,y); const st=dState(fl.did,fl.fi); const k=x+','+y;
  if(t>='a'&&t<='z'){ const c=fl.chests[t]; st.loot[k]=1; sfx('chest'); let msg; if(c&&c.g){ G.gold+=c.g; msg=`Found <b>${c.g} gold</b>.`; } else { invAdd(c); msg=`Found <b>${ITEMS[c].n}</b>!${ITEMS[c].unique?' <span class="good">(unique)</span>':''}`; } log('📦 '+msg); toast('📦 '+msg); refreshHUD(); redraw(); if(c==='gearcore') questUpdate(); return; }
  if(t==='T'){ if(st.trap[k]) { return; } st.trap[k]=1; if(hasScout()){ const s=partyChars().find(c=>c.cls==='scout'&&c.hp>0); log(`🪤 ${s.name} spots a spike trap and disarms it.`); sfx('ok'); redraw(); return; }
    VIEW.flash=0.5; sfx('hit'); for(const c of partyChars()) if(c.hp>0) c.hp=Math.max(1,c.hp-Math.ceil(maxHP(c)*0.12)); log('🪤 Spikes! Everyone takes damage. (A Scout in the party spots traps.)'); refreshHUD(); redraw(); return; }
  if(t>='1'&&t<='9'){ const grp=fl.fixed[t]; const v=await startBattle(grp,{bg:DUNGEONS[fl.did].bg,fixed:true}); if(v==='win'){ st.fixed[k]=1; redraw(); } else if(v==='run'){ stepBack(); } return; }
  if(t==='B'){ await bossEvent(fl); return; }
  if(t==='N'){ await npcEvent(fl,k); return; }
  if(t==='S'||t==='U'||t==='E'||t==='X'||t==='R'){ await actHere(); return; }
  encounterTick(1,()=>fl.spec.enc,DUNGEONS[fl.did].bg); }
function stepBack(){ const D=DIRS[G.dpos.f]; G.dpos.x-=D.x; G.dpos.y-=D.y; redraw(); }
async function actHere(){ if(!G||B||MODALS.length) return;
  if(G.mode==='world'){ const f=wFeat(G.pos.x,G.pos.y); if(f){ await worldFeature(f); return; } setMsg('Nothing here. Walk onto a town 🏘 or dungeon entrance to go in. Tap ⛺ Camp to rest or swap party.'); return; }
  const fl=curFloor(); const t=dCell(fl,G.dpos.x,G.dpos.y);
  if(t==='S'){ const v=await ask('<p>Stairs lead down into darkness.</p>',[{label:'Go down',value:1,cls:'primary'},{label:'Stay',value:0}]); if(v) enterDungeon(fl.did,fl.fi+1,'U'); return; }
  if(t==='U'){ const v=await ask('<p>Go back up the stairs?</p>',[{label:'Go up',value:1,cls:'primary'},{label:'Stay',value:0}]); if(v) enterDungeon(fl.did,fl.fi-1,'S'); return; }
  if(t==='E'||t==='X'){ const v=await ask(`<p>${t==='X'?'A pillar of light rises where the guardian fell.':'Daylight shows at the end of the tunnel.'} Leave the dungeon?</p>`,[{label:'Leave',value:1,cls:'primary'},{label:'Stay',value:0}]); if(v) leaveDungeon(); return; }
  if(t==='R'){ sfx('heal'); restParty(); refreshHUD(); log('💧 The spring restores everyone. (Saved.)'); autosave('spring',{force:1}); const v=await ask('<p>💧 The spring restores your party\'s HP and MP. Your game was saved.</p><p class="dim">You can also swap party members here.</p>',[{label:'Swap party',value:1},{label:'Continue',value:0,cls:'primary'}]); if(v) openPartySwap(); return; }
  // facing something?
  const D=DIRS[G.dpos.f]; const ft=dCell(fl,G.dpos.x+D.x,G.dpos.y+D.y); if(ft==='D'||ft==='L'){ dungeonInput(0); return; }
  setMsg('Nothing to use here. ▲ walks forward, ◀ ▶ turn, ▼ turns around. 🗺 shows the automap.'); }

// ---- input wiring ----
function setupControls(){ const rep={};
  const start=(di,el)=>{ stop(); tryMove(di); rep.t=setTimeout(function loop(){ tryMove(di); rep.t=setTimeout(loop,G&&G.mode==='dungeon'?300:170); },G&&G.mode==='dungeon'?420:300); el.classList.add('on'); rep.el=el; };
  const stop=()=>{ clearTimeout(rep.t); if(rep.el) rep.el.classList.remove('on'); rep.el=null; };
  document.querySelectorAll('[data-dir]').forEach(b=>{ const di=+b.dataset.dir; b.addEventListener('pointerdown',e=>{ e.preventDefault(); audUnlock(); start(di,b); }); ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,stop)); b.addEventListener('contextmenu',e=>e.preventDefault()); });
  window.addEventListener('blur',stop);
  document.addEventListener('keydown',e=>{ if(!G||G.mode==='title') return; const k={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key]; if(k!=null&&!e.repeat){ e.preventDefault(); tryMove(k); } else if(k!=null){ e.preventDefault(); tryMove(k); } if(e.key==='Enter'||e.key===' '){ if(!MODALS.length&&!PANELS.length&&!B){ e.preventDefault(); actHere(); } } });
  // swipe on the view (dungeon: turn / walk; world: step)
  const cv=$('cv'); let sw=null; cv.addEventListener('touchstart',e=>{ if(e.touches.length===1) sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:performance.now()}; else sw=null; },{passive:true});
  cv.addEventListener('touchend',e=>{ if(!sw) return; const t=e.changedTouches[0]; const dx=t.clientX-sw.x, dy=t.clientY-sw.y; const dt=performance.now()-sw.t; sw=null; if(dt>600||Math.hypot(dx,dy)<40) return;
    if(G.mode==='dungeon'){ if(Math.abs(dx)>Math.abs(dy)) tryMove(dx<0?1:3); else tryMove(dy<0?0:2); } },{passive:true});
}

// ---- 07_battle.js ----
// ---------------- turn-based battles ----------------
const BW=512, BH=300;
let BUID=0;
function mkFoe(id){ const E=ENEMIES[id]; return {uid:++BUID,id,name:E.name,side:'e',hp:E.hp,maxhp:E.hp,atk:E.atk,def:E.def,mag:E.mag,res:E.res,spd:E.spd,el:{...E.el},boss:E.boss,st:{},mods:{},stolen:false,E,shake:0,flash:0}; }
function isFoe(u){ return u&&u.side==='e'; }
function uName(u){ return u.name; }
function uMax(u){ return isFoe(u)?u.maxhp:maxHP(u); }
function uSt(u){ if(isFoe(u)) return u.st; u._st=u._st||{}; return u._st; }
function uMods(u){ if(isFoe(u)) return u.mods; u._mods=u._mods||{}; return u._mods; }
function modv(u,k){ const m=uMods(u)[k]; return m?m.m:1; }
function uAlive(u){ return u.hp>0; }
function uSpd(u){ let s=isFoe(u)?u.spd:cSpd(u); const st=uSt(u); if(st.haste) s*=1.5; if(st.slow) s*=0.5; return s; }
function uAtk(u){ return (isFoe(u)?u.atk:cAtk(u))*modv(u,'atk'); }
function uDef(u){ return (isFoe(u)?u.def:cDef(u))*modv(u,'def'); }
function uMag(u){ return (isFoe(u)?u.mag:cMag(u))*modv(u,'mag'); }
function uRes(u){ return (isFoe(u)?u.res:cRes(u))*modv(u,'res'); }
function elMult(u,el){ if(!el) return 1; if(isFoe(u)){ if(u.E.shift&&u.shiftEl) return el===u.shiftEl?2:0.6; return u.el[el]!=null?u.el[el]:1; } return cElRes(u,el); }
function immune(u,s){ if(isFoe(u)) return u.E.imm.includes(s); if(cImm(u,s)) return true; return false; }
function canAct(u){ const st=uSt(u); return uAlive(u)&&!st.sleep&&!st.stun; }
function liveFoes(){ return B.foes.filter(uAlive); }
function liveParty(){ return partyChars().filter(uAlive); }

function startBattle(group,opts){ opts=opts||{}; return new Promise(res=>{ BUID=0; const foes=group.map(mkFoe);
  // name duplicates A, B, C
  const cnt={}; foes.forEach(f=>cnt[f.id]=(cnt[f.id]||0)+1); const seen={}; foes.forEach(f=>{ if(cnt[f.id]>1){ seen[f.id]=(seen[f.id]||0)+1; f.name+=' '+'ABCDE'[seen[f.id]-1]; } });
  if(foes.some(f=>f.E.shift)) foes.forEach(f=>{ if(f.E.shift){ f.shiftEl='fire'; } });
  for(const c of partyChars()){ c._st={}; c._mods={}; }
  B={foes,opts,round:0,res,log:[],cmds:[],ci:0,fx:[],bg:opts.bg||'fields',over:false};
  $('battle').classList.remove('hidden'); document.body.classList.add('inbattle'); playMusic(foes.some(f=>f.boss)?'boss':'battle'); sfx('encounter');
  const names=foes.map(f=>f.name).join(', '); bLog(foes.some(f=>f.boss)?`⚠ <b>${names}</b> blocks the way!`:`Monsters: <b>${names}</b>`);
  bLayout(); bRenderParty(); battleLoop(); tip('battle'); }); }
function bLog(msg){ if(!B) return; B.log.unshift(msg); B.log.length=Math.min(B.log.length,30); const el=$('b-log'); if(el) el.innerHTML=B.log.slice(0,3).map((m,i)=>`<div class="${i?'old':''}">${m}</div>`).join(''); }
function bLayout_v01(){ const n=B.foes.length; B.foes.forEach((f,i)=>{ const sz=(f.boss?72:48)*(f.boss?1.35:1.25); f.sz=sz; f.x=BW*(i+1)/(n+1); f.y=BH*0.86; }); }
function bDraw_v01(){ if(!B) return; const cv=$('bcv'); const x=cv.getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(battleBg(B.bg,BW,BH),0,0);
  for(const f of B.foes){ if(!uAlive(f)&&!f.dying) continue; const spr=enemySpriteProc(f.id); let ox=0,oy=0; if(f.shake>0){ ox=(Math.random()-0.5)*5; f.shake--; } if(f.lunge>0){ oy=4; f.lunge--; }
    x.globalAlpha=f.dying?Math.max(0,f.dying/10):1; if(f.dying) f.dying--; 
    x.fillStyle='rgba(0,0,0,0.35)'; x.beginPath(); x.ellipse(f.x,f.y,f.sz*0.32,f.sz*0.07,0,0,Math.PI*2); x.fill();
    x.drawImage(spr,Math.round(f.x-f.sz/2+ox),Math.round(f.y-f.sz+oy),Math.round(f.sz),Math.round(f.sz));
    if(f.shiftEl){ x.globalCompositeOperation='source-atop'; } x.globalCompositeOperation='source-over';
    if(f.shiftEl){ const col={fire:'#f84',ice:'#8cf',volt:'#ff4',holy:'#fff',dark:'#a4f'}[f.shiftEl]; x.strokeStyle=col; x.lineWidth=2; x.beginPath(); x.arc(f.x,f.y-f.sz*0.55,f.sz*0.5,0,Math.PI*2); x.stroke(); }
    if(f.flash>0){ x.globalAlpha=0.6; x.fillStyle='#fff'; x.fillRect(f.x-f.sz/2,f.y-f.sz,f.sz,f.sz); f.flash--; }
    x.globalAlpha=1;
    if(B.targeting&&B.targeting.side==='e'&&uAlive(f)){ x.fillStyle='#f8e070'; x.beginPath(); x.moveTo(f.x,f.y-f.sz-2); x.lineTo(f.x-5,f.y-f.sz-10); x.lineTo(f.x+5,f.y-f.sz-10); x.fill(); }
    // hp pip

function pickTarget(c,a,done,back){ const el=$('b-cmd'); const t=a.t;

  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>done(G.chars[b.dataset.p]));
